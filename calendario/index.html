function renderEventCards(elId, eventos) {
  const el = document.getElementById(elId);
  if (!eventos.length) { el.innerHTML = '<div class="empty">Nenhum evento neste período</div>'; return; }
  // reset cache so indices are always fresh per render
  _evCache = [];
  el.innerHTML = eventos.map(e => {
    const idx = _evCache.push(e) - 1;
    const [, m, d] = e.data.split('-');
    const cor = e.cor || (e.tipo==='loja' ? 'var(--accent)' : 'var(--yellow)');
    const badge = e.tipo==='loja'
      ? `<span class="event-badge" style="background:color-mix(in srgb,${cor} 18%,transparent);color:${cor}">Loja</span>`
      : '<span class="event-badge badge-comemorativa">Data comemorativa</span>';
    const del = e.tipo==='loja' && e.id
      ? `<button class="event-del" onclick="event.stopPropagation();deletarEvento('${e.id}')"><i class="ti ti-x"></i></button>`
      : '';
    return `
      <div class="event-card" style="border-left:3px solid ${cor};cursor:pointer" onclick="openEventDetail(${idx})">
        <div class="event-date-box" style="border-color:color-mix(in srgb,${cor} 30%,transparent)">
          <div class="event-date-day" style="color:${cor}">${parseInt(d)}</div>
          <div class="event-date-mon">${MESES_ABREV[parseInt(m)-1]}</div>
        </div>
        <div class="event-info">
          <div class="event-title">${e.titulo}</div>
          ${e.desc||e.descricao ? `<div class="event-desc">${e.desc||e.descricao}</div>` : ''}
          ${badge}
        </div>
        ${del}
      </div>`;
  }).join('');
}

// ===== CANVAS DE EVENTO =====
let edEvent = null;
let edTool = 'cursor';
let edPostitColor = '#fef3a7';
let edDragging = null;
let edDragOX = 0, edDragOY = 0;
let edDragMoved = false;
let edResizing = null;
let edResizeDir = 'se';
let edResizeStartX = 0, edResizeStartW = 0;
let edResizeStartY = 0, edResizeStartH = 0;
let edResizeStartL = 0, edResizeStartT = 0;
let edDrawing = false;
let edDrawStartX = 0, edDrawStartY = 0;
let edDrawLastX = 0, edDrawLastY = 0;
let edPanX = 0, edPanY = 0;
let edPanning = false;
let edPanStartX = 0, edPanStartY = 0, edPanOX = 0, edPanOY = 0;
let edCanvasSaveTimer = null;
let edSelectedId = null;
let edWasSelected = false;

function openEventDetail(idx) {
  edEvent = _evCache[idx] || null;
  if (!edEvent) return;

  const ref = edEvent.id
    ? edEvent.id
    : 'c:' + edEvent.data + ':' + encodeURIComponent(edEvent.titulo);
  _setHash('ev=' + ref);

  const cor = edEvent.cor || (edEvent.tipo==='loja' ? 'var(--accent)' : 'var(--yellow)');
  const [, m, d] = edEvent.data.split('-');

  document.getElementById('ed-topbar').style.borderLeft = `4px solid ${cor}`;
  document.getElementById('ed-titulo').textContent = edEvent.titulo || '';
  document.getElementById('ed-sub').textContent = `${parseInt(d)} de ${MESES[parseInt(m)-1]}`;

  const badgeEl = document.getElementById('ed-badge');
  if (edEvent.tipo === 'loja') {
    badgeEl.textContent = 'Loja';
    badgeEl.style.cssText = `background:color-mix(in srgb,${cor} 18%,transparent);color:${cor}`;
  } else {
    badgeEl.textContent = 'Data Comemorativa';
    badgeEl.style.cssText = `background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)`;
  }

  selectTool('cursor');
  edSelectedId = null;
  _showFmtbar(null);
  edPanX = 0; edPanY = 0; _applyPan();
  _renderCanvas();

  const detail = document.getElementById('event-detail');
  detail.classList.toggle('modo-plano', _modoPlanejamento());
  detail.classList.add('open');
}

function closeEventDetail() {
  document.getElementById('event-detail').classList.remove('open');
  _showFmtbar(null);
  _setHash('');
  edEvent = null;
}

// atualiza o hash da URL com fallback (file:// bloqueia replaceState)
function _setHash(h) {
  try {
    history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  } catch (e) {
    location.hash = h || '';
  }
}


// ── FERRAMENTAS ──────────────────────────────────────
function selectTool(tool) {
  edTool = tool;
  document.querySelectorAll('.ed-tool').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + tool);
  if (btn) btn.classList.add('active');
  const canvas = document.getElementById('ed-canvas');
  canvas.style.cursor = tool === 'cursor' ? 'default' : 'crosshair';
  // seletor de cor só aparece com a ferramenta post-it ativa
  const pcWrap = document.getElementById('ed-pc-wrap');
  pcWrap.style.display = tool === 'postit' ? 'flex' : 'none';
  if (tool !== 'postit') document.getElementById('ed-pc-pop').classList.remove('open');
}

function selectPostitColor(el) {
  edPostitColor = el.dataset.color;
  document.getElementById('ed-pc-current').style.background = edPostitColor;
  document.getElementById('ed-pc-pop').classList.remove('open');
  if (edTool !== 'postit') selectTool('postit');
}

function togglePostitPop(e) {
  e.stopPropagation();
  document.getElementById('ed-pc-pop').classList.toggle('open');
}

// clicar fora fecha os popovers (cores e fontes)
document.addEventListener('click', (e) => {
  if (!e.target.closest('#ed-pc-wrap')) {
    const pop = document.getElementById('ed-pc-pop');
    if (pop) pop.classList.remove('open');
  }
  if (!e.target.closest('#fmt-font-wrap')) {
    const fpop = document.getElementById('fmt-font-pop');
    if (fpop) fpop.classList.remove('open');
  }
  if (!e.target.closest('#fmt-c-wrap') && !e.target.closest('#fmt-hl')) {
    const cpop = document.getElementById('fmt-c-pop');
    if (cpop) cpop.classList.remove('open');
  }
  if (!e.target.closest('#fmt-lh-wrap')) {
    const lpop = document.getElementById('fmt-lh-pop');
    if (lpop) lpop.classList.remove('open');
  }
  if (!e.target.closest('.cn-add')) {
    document.querySelectorAll('.cn-add-menu').forEach(m => m.classList.remove('open'));
    document.querySelectorAll('.cn-add').forEach(w => w.style.zIndex = '');
  }
});

// ── CRIAR ELEMENTO ────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('ed-canvas');
  canvas.addEventListener('click', canvasClick);
  canvas.addEventListener('mousedown', canvasMouseDown);
  window.addEventListener('mousemove', canvasMouseMove);
  window.addEventListener('mouseup', canvasMouseUp);
  canvas.addEventListener('touchstart', canvasTouchStart, { passive: false });
  window.addEventListener('touchmove', canvasTouchMove, { passive: false });
  window.addEventListener('touchend', canvasTouchEnd);
  // rolagem com roda do mouse / trackpad
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    edPanX -= e.deltaX;
    edPanY -= e.deltaY;
    _applyPan();
  }, { passive: false });
});

function canvasClick(e) {
  if (edDragMoved) { edDragMoved = false; return; } // arrastar não cria elemento
  const canvas = document.getElementById('ed-canvas');
  if (e.target !== canvas) return;
  if (edTool === 'cursor') _selectEl(null);
  // criação acontece no mouseup do desenho (canvasMouseUp)
}

function _canvasPoint(cx, cy) {
  const canvas = document.getElementById('ed-canvas');
  const rect = canvas.getBoundingClientRect();
  return { x: cx - rect.left - edPanX, y: cy - rect.top - edPanY };
}

// planejamento semanal: rolagem tipo página (trava no topo, desce conforme o conteúdo)
function _modoPlanejamento() {
  return !!(edEvent && edEvent.titulo === 'Planejamento semanal');
}

function _clampPan() {
  if (!_modoPlanejamento()) return;
  const canvas = document.getElementById('ed-canvas');
  const els = (edEvent && edEvent.canvas) || [];
  const fimY = els.length ? Math.max(...els.map(e => (e.y || 0) + (e.h || 100))) : 0;
  const fimX = els.length ? Math.max(...els.map(e => (e.x || 0) + (e.w || 200))) : 0;
  const folga = Math.round(canvas.clientHeight * 0.7); // espaço livre p/ criar abaixo do conteúdo
  const minPanY = Math.min(0, canvas.clientHeight - fimY - folga);
  const minPanX = Math.min(0, canvas.clientWidth - fimX - 40);  // horizontal só se não couber
  edPanY = Math.max(minPanY, Math.min(0, edPanY));
  edPanX = Math.max(minPanX, Math.min(0, edPanX));
}

function _applyPan() {
  _clampPan();
  document.getElementById('ed-world').style.transform = `translate(${edPanX}px,${edPanY}px)`;
  document.getElementById('ed-canvas').style.backgroundPosition = `${edPanX}px ${edPanY}px`;
}

function _startDraw(cx, cy) {
  const world = document.getElementById('ed-world');
  const p = _canvasPoint(cx, cy);
  edDrawing = true;
  edDrawStartX = edDrawLastX = p.x;
  edDrawStartY = edDrawLastY = p.y;
  const prev = document.createElement('div');
  prev.id = 'cn-preview';
  prev.style.left = p.x + 'px';
  prev.style.top  = p.y + 'px';
  prev.style.width = '0px';
  prev.style.height = '0px';
  world.appendChild(prev);
}

function _updateDraw(cx, cy) {
  const p = _canvasPoint(cx, cy);
  edDrawLastX = p.x; edDrawLastY = p.y;
  const prev = document.getElementById('cn-preview');
  if (!prev) return;
  prev.style.left   = Math.min(p.x, edDrawStartX) + 'px';
  prev.style.top    = Math.min(p.y, edDrawStartY) + 'px';
  prev.style.width  = Math.abs(p.x - edDrawStartX) + 'px';
  prev.style.height = Math.abs(p.y - edDrawStartY) + 'px';
}

function _endDraw() {
  edDrawing = false;
  const prev = document.getElementById('cn-preview');
  if (prev) prev.remove();
  const w = Math.abs(edDrawLastX - edDrawStartX);
  const h = Math.abs(edDrawLastY - edDrawStartY);
  const x = Math.min(edDrawLastX, edDrawStartX);
  const y = Math.min(edDrawLastY, edDrawStartY);
  if (w < 15 && h < 15) {
    // clique simples: tamanho padrão
    _addElement(edTool, edDrawStartX - 80, edDrawStartY - 40);
  } else {
    _addElement(edTool, x, y, Math.max(30, w), Math.max(30, h));
  }
  edDragMoved = true; // suprime o click que dispara em seguida
  selectTool('cursor');
}

function _uid() { return 'el' + Date.now().toString(36) + Math.floor(Math.random()*1000); }

function _addElement(type, x, y, w, h) {
  if (!edEvent) return;
  if (!edEvent.canvas) edEvent.canvas = [];
  const el = { id: _uid(), type, x, y,
    content: '', color: type === 'postit' ? edPostitColor : '' };
  if (w) el.w = Math.round(w);
  if (h) el.h = Math.round(h);
  edEvent.canvas.push(el);
  _renderCanvas();
  // foca no elemento recém criado
  setTimeout(() => {
    const node = document.querySelector(`[data-id="${el.id}"] .cn-content`);
    if (node) { node.contentEditable = 'true'; node.focus(); }
    const vin = document.querySelector(`[data-id="${el.id}"] .cn-video-input`);
    if (vin) vin.focus();
    _selectEl(el.id);
  }, 30);
  _scheduleCanvasSave();
}

// ── RENDER ────────────────────────────────────────────
function _renderCanvas() {
  const world = document.getElementById('ed-world');
  const els = (edEvent && edEvent.canvas) || [];
  world.innerHTML = els.map(el => {
    const sel = edSelectedId === el.id ? ' selected' : '';
    // caixa de foto/vídeo vazia que herdou tamanho estreito: volta ao mínimo usável
    if ((el.type === 'photo' || el.type === 'video') && !el.url) {
      if (el.w) el.w = Math.max(el.w, 170);
      if (el.h) el.h = Math.max(el.h, 150);
    }
    if (el.type === 'postit') {
      return `<div class="cn-el cn-postit${sel}" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;background:${el.color||'#fef3a7'};width:${el.w||180}px${el.h?`;height:${el.h}px`:''};${_wrapStyle(el)}"
        onmousedown="elMouseDown(event,'${el.id}')"
        ontouchstart="elTouchStart(event,'${el.id}')">
        <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>
        <div class="cn-content${el.hl ? ' hl' : ''}" contenteditable="false" data-ph="Escreva aqui..."
          style="${_textStyle(el)}"
          onclick="_contentClick(event,'${el.id}',this)"
          oninput="_growToContent('${el.id}')"
          onblur="_saveElContent('${el.id}',this)">${el.content||''}</div>
        ${_handlesHTML(el.id)}
      </div>`;
    }
    if (el.type === 'photo') {
      return `<div class="cn-el cn-video${sel}" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;width:${el.w||220}px;height:${el.h||220}px"
        onmousedown="elMouseDown(event,'${el.id}')"
        ontouchstart="elTouchStart(event,'${el.id}')">
        <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>
        ${_photoFrameHTML(el)}
        ${_handlesHTML(el.id)}
      </div>`;
    }
    if (el.type === 'video') {
      return `<div class="cn-el cn-video${sel}" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;width:${el.w||210}px;height:${el.h||300}px"
        onmousedown="elMouseDown(event,'${el.id}')"
        ontouchstart="elTouchStart(event,'${el.id}')">
        <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>
        ${_videoFrameHTML(el)}
        ${_handlesHTML(el.id)}
      </div>`;
    }
    if (el.type === 'add') {
      return `<div class="cn-el cn-add" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;width:${el.w||190}px">
        <button class="cn-add-btn" title="Adicionar módulo"
          onclick="event.stopPropagation();toggleAddMenu('${el.id}')"
          onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
          <i class="ti ti-plus"></i>
        </button>
        <div class="cn-add-menu" id="addmenu-${el.id}">
          <button class="cn-add-opt" onclick="event.stopPropagation();addModulo('${el.id}','photo')"><i class="ti ti-photo"></i> Caixa de foto</button>
          <button class="cn-add-opt" onclick="event.stopPropagation();addModulo('${el.id}','video')"><i class="ti ti-video"></i> Caixa de vídeo</button>
          <button class="cn-add-opt" onclick="event.stopPropagation();addModulo('${el.id}','text')"><i class="ti ti-letter-t"></i> Caixa de texto</button>
          <button class="cn-add-opt" onclick="event.stopPropagation();addModulo('${el.id}','checklist')"><i class="ti ti-list-check"></i> Checklist</button>
          <button class="cn-add-opt" onclick="event.stopPropagation();addModulo('${el.id}','enquete')"><i class="ti ti-chart-bar"></i> Enquete</button>
        </div>
      </div>`;
    }
    if (el.type === 'checklist') {
      const items = el.items && el.items.length ? el.items : (el.items = [{ t: '', done: false }]);
      const rows = items.map((it, i) => `
        <div class="ck-row">
          <button class="ck-box${it.done ? ' done' : ''}" title="Marcar como feito"
            onclick="event.stopPropagation();ckToggle('${el.id}',${i})"
            onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-check"></i></button>
          <div class="ck-txt${it.done ? ' done' : ''}" contenteditable="true" data-ph="Item..."
            onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"
            onkeydown="ckKey(event,'${el.id}',${i})"
            onblur="ckSaveItem('${el.id}',${i},this)">${_esc(it.t || '')}</div>
          <button class="ck-rm" title="Remover item"
            onclick="event.stopPropagation();ckDelItem('${el.id}',${i})"
            onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-x"></i></button>
        </div>`).join('');
      return `<div class="cn-el cn-card${sel}" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;width:${el.w || 190}px"
        onmousedown="elMouseDown(event,'${el.id}')"
        ontouchstart="elTouchStart(event,'${el.id}')">
        <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>

      </div>`;
    }
    if (el.type === 'enquete') {
      const opts = el.opts && el.opts.length ? el.opts : (el.opts = [{ t: '' }, { t: '' }]);
      const rows = opts.map((o, i) => `
        <div class="pq-row">
          <span class="pq-letra">${String.fromCharCode(65 + i)}</span>
          <div class="pq-txt" contenteditable="true" data-ph="Opção..."
            onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"
            onkeydown="pqKey(event,'${el.id}',${i})"
            onblur="pqSaveOpt('${el.id}',${i},this)">${_esc(o.t || '')}</div>
          <button class="ck-rm" title="Remover opção"
            onclick="event.stopPropagation();pqDelOpt('${el.id}',${i})"
            onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-x"></i></button>
        </div>`).join('');
      return `<div class="cn-el cn-card${sel}" data-id="${el.id}"
        style="left:${el.x}px;top:${el.y}px;width:${el.w || 190}px"
        onmousedown="elMouseDown(event,'${el.id}')"
        ontouchstart="elTouchStart(event,'${el.id}')">
        <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>
        <div class="cn-card-head"><i class="ti ti-chart-bar"></i> Enquete</div>
        <div class="pq-q" contenteditable="true" data-ph="Pergunta..."
          onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"
          onblur="pqSaveQ('${el.id}',this)">${_esc(el.q || '')}</div>
        ${rows}
        <button class="ck-add-row" onclick="event.stopPropagation();pqAddOpt('${el.id}')"
          onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-plus"></i> opção</button>
      </div>`;
    }
    return `<div class="cn-el cn-text${sel}" data-id="${el.id}"
      style="left:${el.x}px;top:${el.y}px;width:${el.w||200}px${el.h?`;height:${el.h}px`:''};${_wrapStyle(el)}"
      onmousedown="elMouseDown(event,'${el.id}')"
      ontouchstart="elTouchStart(event,'${el.id}')">
      <button class="cn-del" title="Excluir" onclick="event.stopPropagation();deleteEl('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-trash"></i></button>
      <div class="cn-content${el.hl ? ' hl' : ''}" contenteditable="false" data-ph="Texto livre..."
        style="${_textStyle(el)}"
        onclick="_contentClick(event,'${el.id}',this)"
        oninput="_growToContent('${el.id}')"
        onblur="_saveElContent('${el.id}',this)">${el.content||''}</div>
      ${_handlesHTML(el.id)}
    </div>`;
  }).join('');
  _renderPlanBadges();
  // caixas salvas com texto cortado: cresce para mostrar tudo
  setTimeout(() => {
    els.forEach(el => {
      if (el.type === 'postit' || el.type === 'text') _growToContent(el.id);
      if (el.type === 'checklist' || el.type === 'enquete') _syncCardH(el.id);
    });
    _reflowPlanejamento();
  }, 0);
}

function _wrapStyle(el) {
  let s = '';
  if (el.align) s += `text-align:${el.align};`;
  if (el.lh)    s += `line-height:${el.lh};`;
  return s;
}

function _textStyle(el) {
  let s = '';
  if (el.font) s += `font-family:${el.font};`;
  if (el.fs)   s += `font-size:${el.fs}px;`;
  if (el.bold) s += 'font-weight:700;';
  if (el.tc)   s += `color:${el.tc};`;
  if (el.hl && el.hlc) s += `--hlc:${el.hlc};`;
  return s;
}

// texto livre: 1 clique já entra em edição; post-it: 2º clique edita
function _contentClick(e, id, node) {
  e.stopPropagation();
  if (edDragMoved) { edDragMoved = false; return; }
  if (node.isContentEditable) return;
  const el = edEvent && edEvent.canvas ? edEvent.canvas.find(x => x.id === id) : null;
  const umClique = el && el.type === 'text';
  if (umClique || (edWasSelected && edSelectedId === id)) {
    node.contentEditable = 'true';
    node.focus();
  }
}

// ── MOLDURA DE VÍDEO ─────────────────────────────────
function _videoFrameHTML(el) {
  if (!el.url || el._edit) {
    const v = (el.url || '').replace(/"/g, '&quot;');
    return `<div class="cn-video-frame"><div class="cn-video-setup"
      onmousedown="event.stopPropagation();_selectEl('${el.id}')" ontouchstart="event.stopPropagation();_selectEl('${el.id}')">
      <i class="ti ti-video"></i>
      <input class="cn-video-input" placeholder="Cole o link (TikTok, Reels, YouTube...)" value="${v}"
        onkeydown="if(event.key==='Enter'){event.preventDefault();saveVideoUrl('${el.id}',this)}">
      <button class="cn-video-ok" onclick="saveVideoUrl('${el.id}',this.parentNode.querySelector('input'))">Salvar</button>
    </div></div>`;
  }
  const url = el.url.replace(/'/g, '%27').replace(/"/g, '%22');
  const pid = 'cnv' + el.id;
  const play = `<div class="cn-video-play"><div onclick="event.stopPropagation();window.open('${url}','_blank')"
    onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>`;

    setTimeout(() => {
      fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(el.url))

          const box = document.getElementById(pid);
          if (box && d.thumbnail_url) box.innerHTML = `<img src="${d.thumbnail_url}" style="width:100%;height:100%;object-fit:cover;display:block;">`;

  } else if (el.url.includes('instagram.com') || el.url.includes('instagr.am')) {

// ── MOLDURA DE FOTO ──────────────────────────────────
function _photoFrameHTML(el) {
  if (el._up) {
    return `<div class="cn-video-frame"><div class="cn-video-setup">
      <i class="ti ti-loader-2"></i>
      <div style="font-size:.72rem;color:var(--text-muted)">Enviando...</div>
    </div></div>`;
  }
  if (!el.url) {
    return `<div class="cn-video-frame"><div class="cn-video-setup"
      onmousedown="event.stopPropagation();_selectEl('${el.id}')" ontouchstart="event.stopPropagation();_selectEl('${el.id}')">
      <i class="ti ti-photo"></i>
      <button class="cn-video-ok" onclick="pickPhoto('${el.id}')">Escolher foto</button>
    </div></div>`;
  }
  const edit = `<button class="cn-video-edit" title="Trocar foto" onclick="event.stopPropagation();pickPhoto('${el.id}')" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"><i class="ti ti-photo"></i></button>`;
  return `<div class="cn-video-frame"><img src="${el.url}" draggable="false" style="width:100%;height:100%;object-fit:contain;display:block;background:#e8e3db;">${edit}</div>`;
}

let edPhotoTarget = null;
function pickPhoto(id) {
  edPhotoTarget = id;
  document.getElementById('cn-photo-file').click();
}

async function _photoPicked(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file || !edPhotoTarget || !edEvent || !edEvent.canvas) return;
  const el = edEvent.canvas.find(x => x.id === edPhotoTarget);
  edPhotoTarget = null;
  if (!el) return;
  el._up = true;
  _renderCanvas();
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `canvas/${el.id}_${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('produto-fotos').upload(path, file, { upsert: true });
  delete el._up;
  if (error) {
    showToast('Erro ao enviar foto: ' + error.message, 'error');
    _renderCanvas();
    return;
  }
  const { data } = sb.storage.from('produto-fotos').getPublicUrl(path);
  el.url = data.publicUrl;
  _renderCanvas();
  _scheduleCanvasSave();
  showToast('Foto adicionada!');
}

function saveVideoUrl(id, input) {
  if (!edEvent || !edEvent.canvas) return;
  const el = edEvent.canvas.find(x => x.id === id);
  if (!el) return;
  el.url = input.value.trim();
  delete el._edit;
  _renderCanvas();
  _scheduleCanvasSave();
}

function editVideoUrl(id) {
  if (!edEvent || !edEvent.canvas) return;
  const el = edEvent.canvas.find(x => x.id === id);
  if (!el) return;
  el._edit = true;
  _renderCanvas();
  setTimeout(() => {
    const i = document.querySelector(`[data-id="${id}"] .cn-video-input`);
    if (i) i.focus();
  }, 30);
}

function _handlesHTML(id) {
  return ['nw','ne','sw','se'].map(d =>
    `<div class="cn-h cn-h-${d}" onmousedown="resizeMouseDown(event,'${id}','${d}')" ontouchstart="resizeTouchStart(event,'${id}','${d}')"></div>`
  ).join('');
}

function _selectEl(id) {
  edSelectedId = id;
  document.querySelectorAll('.cn-el').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  const el = id && edEvent && edEvent.canvas ? edEvent.canvas.find(x => x.id === id) : null;
  _showFmtbar(el && (el.type === 'postit' || el.type === 'text') ? el : null);
}

function _saveElContent(id, node) {
  node.contentEditable = 'false';
  if (!edEvent) return;
  const el = edEvent.canvas && edEvent.canvas.find(e => e.id === id);
  if (el) {
    el.content = node.textContent;
    if (el.type === 'text') _fitToContent(id);
    else _growToContent(id);
    _scheduleCanvasSave();
  }
}

// aumenta a altura da caixa para o texto aparecer inteiro (nunca corta)
function _growToContent(id) {
  const wrap = document.querySelector(`[data-id="${id}"]`);
  if (!wrap || !edEvent || !edEvent.canvas) return;
  const el = edEvent.canvas.find(x => x.id === id);
  if (!el) return;
  const content = wrap.querySelector('.cn-content');
  if (!content || !content.scrollHeight) return;
  if (content.scrollHeight > content.clientHeight + 1) {
    const h = wrap.offsetHeight + (content.scrollHeight - content.clientHeight);
    wrap.style.height = h + 'px';
    el.h = h;
    _reflowPlanejamento(); // empurra o que está embaixo na coluna
  }
}

// encolhe a caixa para abraçar o texto (mantém a quebra de linha atual)
function _fitToContent(id) {
  const wrap = document.querySelector(`[data-id="${id}"]`);
  if (!wrap || !edEvent || !edEvent.canvas) return;
  const el = edEvent.canvas.find(x => x.id === id);
  if (!el) return;
  const content = wrap.querySelector('.cn-content');
  const curW = wrap.offsetWidth;
  // solta a caixa pra medir o tamanho natural do texto
  content.style.height = 'auto';
  wrap.style.height = 'auto';
  wrap.style.maxWidth = curW + 'px';
  wrap.style.width = 'max-content';
  const w = Math.max(60, Math.ceil(wrap.offsetWidth));
  const h = Math.max(30, Math.ceil(wrap.offsetHeight));
  wrap.style.maxWidth = '';
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  content.style.height = '100%';
  el.w = w; el.h = h;
  _reflowPlanejamento();
}

function deleteEl(id) {
  if (!edEvent || !edEvent.canvas) return;
  // no planejamento a coluna se reempilha sozinha e fecha o buraco (reflow no render)
  edEvent.canvas = edEvent.canvas.filter(e => e.id !== id);
  if (edSelectedId === id) { edSelectedId = null; _showFmtbar(null); }
  _renderCanvas();
  _scheduleCanvasSave();
}

// ── BARRA DE FORMATAÇÃO ───────────────────────────────
function _showFmtbar(el) {
  const bar = document.getElementById('ed-fmtbar');
  if (!bar) return;
  if (!el) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  _setFontLabel(el.font || "'DM Sans',sans-serif");
  document.getElementById('fmt-size').value = el.fs || 16;
  document.getElementById('fmt-bold').classList.toggle('active', !!el.bold);
  document.getElementById('fmt-hl').classList.toggle('active', !!el.hl);
  document.getElementById('fmt-align-icon').className = 'ti ti-align-' + (el.align || 'left');
  const lh = el.lh || 1.5;
  document.querySelectorAll('.fmt-lh-opt').forEach(o => o.classList.toggle('active', parseFloat(o.dataset.lh) === lh));
  document.querySelectorAll('.fmt-hlc').forEach(d => d.classList.toggle('active', d.dataset.hlc === (el.hl ? (el.hlc || '255,210,50') : '')));
  const tc = el.tc || '#1a1814';
  document.getElementById('fmt-c-btn').style.background = tc;
  document.querySelectorAll('.fmt-c').forEach(d => d.classList.toggle('active', d.dataset.c === tc));
}

function _fmtEl() {
  return edEvent && edEvent.canvas ? edEvent.canvas.find(x => x.id === edSelectedId) : null;
}

function fmtApply() {
  const el = _fmtEl(); if (!el) return;
  el.fs = parseInt(document.getElementById('fmt-size').value) || 16;
  _applyTextStyle(el);
  if (el.type === 'text') _fitToContent(el.id);
  _scheduleCanvasSave();
}

function toggleFontPop(e) {
  e.stopPropagation();
  document.getElementById('fmt-font-pop').classList.toggle('open');
}

function selectFont(opt) {
  const el = _fmtEl(); if (!el) return;
  el.font = opt.dataset.font;
  _setFontLabel(el.font);
  document.getElementById('fmt-font-pop').classList.remove('open');
  _applyTextStyle(el);
  if (el.type === 'text') _fitToContent(el.id);
  _scheduleCanvasSave();
}

function _setFontLabel(font) {
  const label = document.getElementById('fmt-font-label');
  const opt = [...document.querySelectorAll('.fmt-font-opt')].find(o => o.dataset.font === font);
  label.textContent = opt ? opt.textContent : 'DM Sans';
  label.style.fontFamily = font || "'DM Sans',sans-serif";
  document.querySelectorAll('.fmt-font-opt').forEach(o => o.classList.toggle('active', o.dataset.font === font));
}

function fmtColor(dot) {
  const el = _fmtEl(); if (!el) return;
  el.tc = dot.dataset.c;
  document.getElementById('fmt-c-btn').style.background = el.tc;
  document.querySelectorAll('.fmt-c').forEach(d => d.classList.toggle('active', d === dot));
  document.getElementById('fmt-c-pop').classList.remove('open');
  _applyTextStyle(el);
  _scheduleCanvasSave();
}

function fmtBoldToggle() {
  const el = _fmtEl(); if (!el) return;
  el.bold = !el.bold;
  document.getElementById('fmt-bold').classList.toggle('active', el.bold);
  _applyTextStyle(el);
  if (el.type === 'text') _fitToContent(el.id);
  _scheduleCanvasSave();
}

function _applyTextStyle(el) {
  const node = document.querySelector(`[data-id="${el.id}"] .cn-content`);
  if (!node) return;
  node.style.fontFamily = el.font || '';
  node.style.fontSize   = el.fs ? el.fs + 'px' : '';
  node.style.fontWeight = el.bold ? '700' : '';
  node.style.color      = el.tc || '';
  node.classList.toggle('hl', !!el.hl);
  node.style.setProperty('--hlc', el.hlc || '255,210,50');
  const wrap = document.querySelector(`[data-id="${el.id}"]`);
  if (wrap) {
    wrap.style.textAlign  = el.align || '';
    wrap.style.lineHeight = el.lh ? String(el.lh) : '';
  }
}

function fmtAlignToggle() {
  const el = _fmtEl(); if (!el) return;
  const ordem = ['left', 'center', 'right'];
  el.align = ordem[(ordem.indexOf(el.align || 'left') + 1) % 3];
  document.getElementById('fmt-align-icon').className = 'ti ti-align-' + el.align;
  _applyTextStyle(el);
  _scheduleCanvasSave();
}

function toggleLhPop(e) {
  e.stopPropagation();
  document.getElementById('fmt-lh-pop').classList.toggle('open');
}

function selectLh(opt) {
  const el = _fmtEl(); if (!el) return;
  el.lh = parseFloat(opt.dataset.lh);
  document.querySelectorAll('.fmt-lh-opt').forEach(o => o.classList.toggle('active', o === opt));
  document.getElementById('fmt-lh-pop').classList.remove('open');
  _applyTextStyle(el);
  if (el.type === 'text') _fitToContent(el.id);
  _scheduleCanvasSave();
}

function toggleColorPop(e) {
  e.stopPropagation();
  document.getElementById('fmt-c-pop').classList.toggle('open');
}

function selectHl(dot) {
  const el = _fmtEl(); if (!el) return;
  const c = dot.dataset.hlc;
  if (!c) { el.hl = false; }
  else { el.hl = true; el.hlc = c; }
  document.getElementById('fmt-c-pop').classList.remove('open');
  document.getElementById('fmt-hl').classList.toggle('active', !!el.hl);
  document.querySelectorAll('.fmt-hlc').forEach(d => d.classList.toggle('active', d.dataset.hlc === (el.hl ? el.hlc : '')));
  _applyTextStyle(el);
  if (el.type === 'text') _fitToContent(el.id);
  _scheduleCanvasSave();
}

// ── DRAG (mouse) ──────────────────────────────────────
function elMouseDown(e, id) {
  if (e.button !== 0) return;
  if (edTool !== 'cursor') return;
  if (e.target.classList.contains('cn-h') || e.target.classList.contains('cn-del')) return;
  if (e.target.isContentEditable) return; // em edição: deixa selecionar texto
  e.stopPropagation();
  edWasSelected = (edSelectedId === id);
  _selectEl(id);
  if (_modoPlanejamento()) return; // estrutura fixa: seleciona mas não arrasta
  const node = document.querySelector(`[data-id="${id}"]`);
  if (!node) return;
  edDragging = id;
  edDragMoved = false;
  edDragOX = e.clientX - node.offsetLeft;
  edDragOY = e.clientY - node.offsetTop;
}

function resizeMouseDown(e, id, dir) {
  e.stopPropagation();
  e.preventDefault();
  _startResize(id, dir || 'se', e.clientX, e.clientY);
}

function _startResize(id, dir, cx, cy) {
  edResizing = id;
  edResizeDir = dir;
  edResizeStartX = cx;
  edResizeStartY = cy;
  const node = document.querySelector(`[data-id="${id}"]`);
  edResizeStartW = node ? node.offsetWidth  : 180;
  edResizeStartH = node ? node.offsetHeight : 80;
  edResizeStartL = node ? node.offsetLeft : 0;
  edResizeStartT = node ? node.offsetTop  : 0;
  _selectEl(id);
}

function _applyResize(cx, cy) {
  const node = document.querySelector(`[data-id="${edResizing}"]`);
  if (!node) return;
  const dx = cx - edResizeStartX, dy = cy - edResizeStartY;
  let x = edResizeStartL, y = edResizeStartT;
  let w = edResizeStartW, h = edResizeStartH;
  if (edResizeDir.includes('e')) w = edResizeStartW + dx;
  if (edResizeDir.includes('s')) h = edResizeStartH + dy;
  if (edResizeDir.includes('w')) { w = edResizeStartW - dx; x = edResizeStartL + dx; }
  if (edResizeDir.includes('n')) { h = edResizeStartH - dy; y = edResizeStartT + dy; }
  // piso mínimo só para o elemento não sumir
  if (w < 30) { if (edResizeDir.includes('w')) x = edResizeStartL + edResizeStartW - 30; w = 30; }
  if (h < 30) { if (edResizeDir.includes('n')) y = edResizeStartT + edResizeStartH - 30; h = 30; }
  node.style.left = x + 'px';
  node.style.top  = y + 'px';
  node.style.width  = w + 'px';
  node.style.height = h + 'px';
}

function canvasMouseDown(e) {
  if (e.target !== document.getElementById('ed-canvas')) return;
  if (edTool === 'cursor') {
    // arrastar o fundo = mover o canvas (pan)
    edPanning = true;
    edPanStartX = e.clientX; edPanStartY = e.clientY;
    edPanOX = edPanX; edPanOY = edPanY;
    return;
  }
  e.preventDefault();
  _startDraw(e.clientX, e.clientY);
}

function canvasMouseMove(e) {
  if (edPanning) {
    edPanX = edPanOX + e.clientX - edPanStartX;
    edPanY = edPanOY + e.clientY - edPanStartY;
    edDragMoved = true;
    _applyPan();
    return;
  }
  if (edDrawing) { _updateDraw(e.clientX, e.clientY); return; }
  if (edResizing) { _applyResize(e.clientX, e.clientY); return; }
  if (!edDragging) return;
  edDragMoved = true;
  _moveDragging(e.clientX, e.clientY);
}

function _moveDragging(cx, cy) {
  if (!edDragging) return;
  const node = document.querySelector(`[data-id="${edDragging}"]`);
  if (!node) return;
  node.style.left = (cx - edDragOX) + 'px';
  node.style.top  = (cy - edDragOY) + 'px';
}

function canvasMouseUp(e) {
  if (edPanning) { edPanning = false; return; }
  if (edDrawing) { _endDraw(); return; }
  if (edResizing) {
    const node = document.querySelector(`[data-id="${edResizing}"]`);
    if (node && edEvent && edEvent.canvas) {
      const el = edEvent.canvas.find(x => x.id === edResizing);
      if (el) {
        el.x = node.offsetLeft; el.y = node.offsetTop;
        el.w = node.offsetWidth; el.h = node.offsetHeight;
      }
      _scheduleCanvasSave();
    }
    edResizing = null;
    edDragMoved = true; // suprime o click que dispara em seguida
    return;
  }
  if (!edDragging) return;
  const node = document.querySelector(`[data-id="${edDragging}"]`);
  if (node && edEvent && edEvent.canvas) {
    const el = edEvent.canvas.find(x => x.id === edDragging);
    if (el) { el.x = parseInt(node.style.left); el.y = parseInt(node.style.top); }
    _scheduleCanvasSave();
  }
  edDragging = null;
}

// ── DRAG (touch) ──────────────────────────────────────
function elTouchStart(e, id) {
  if (edTool !== 'cursor') return;
  if (e.target.classList.contains('cn-h') || e.target.classList.contains('cn-del')) return;
  if (e.target.isContentEditable) return;
  e.stopPropagation();
  edWasSelected = (edSelectedId === id);
  _selectEl(id);
  if (_modoPlanejamento()) return; // estrutura fixa: seleciona mas não arrasta
  const node = document.querySelector(`[data-id="${id}"]`);
  if (!node) return;
  edDragging = id;
  edDragMoved = false;
  const t = e.touches[0];
  edDragOX = t.clientX - node.offsetLeft;
  edDragOY = t.clientY - node.offsetTop;
}

function resizeTouchStart(e, id, dir) {
  e.stopPropagation();
  e.preventDefault();
  const t = e.touches[0];
  _startResize(id, dir || 'se', t.clientX, t.clientY);
}

function canvasTouchStart(e) {
  if (e.target !== document.getElementById('ed-canvas')) return;
  const t = e.touches[0];
  if (edTool === 'cursor') {
    edPanning = true;
    edPanStartX = t.clientX; edPanStartY = t.clientY;
    edPanOX = edPanX; edPanOY = edPanY;
    return;
  }
  e.preventDefault();
  _startDraw(t.clientX, t.clientY);
}

function canvasTouchMove(e) {
  if (edPanning) {
    e.preventDefault();
    const t = e.touches[0];
    edPanX = edPanOX + t.clientX - edPanStartX;
    edPanY = edPanOY + t.clientY - edPanStartY;
    edDragMoved = true;
    _applyPan();
    return;
  }
  if (edDrawing) {
    e.preventDefault();
    const t = e.touches[0];
    _updateDraw(t.clientX, t.clientY);
    return;
  }
  if (edResizing) {
    e.preventDefault();
    const t = e.touches[0];
    _applyResize(t.clientX, t.clientY);
    return;
  }
  if (!edDragging) return;
  e.preventDefault();
  edDragMoved = true;
  const t = e.touches[0];
  _moveDragging(t.clientX, t.clientY);
}

function canvasTouchEnd() { canvasMouseUp({}); }

// ── SALVAR ────────────────────────────────────────────
function _scheduleCanvasSave() {
  clearTimeout(edCanvasSaveTimer);
  edCanvasSaveTimer = setTimeout(_saveCanvas, 1200);
}

async function salvarESair() {
  if (document.activeElement) document.activeElement.blur(); // commita texto em edição
  clearTimeout(edCanvasSaveTimer);
  const ok = await _saveCanvas();
  if (ok) showToast('Salvo!');
  closeEventDetail();
  renderView();
}

async function _saveCanvas() {
  if (!edEvent) return false;
  if (!edEvent.id) {
    // comemorativa: cria um registro espelho em eventos_loja para guardar o canvas
    const { data: row, error } = await sb.from('eventos_loja')
      .insert({ data: edEvent.data, titulo: edEvent.titulo, descricao: edEvent.desc || null, cor: edEvent.cor || null, canvas: edEvent.canvas || [] })
      .select().single();
    if (error) { showToast('Erro ao salvar: ' + error.message, 'error'); return false; }
    edEvent.id = row.id;
    eventosLoja.push({ ...row, tipo: 'loja' });
  } else {
    const { error } = await sb.from('eventos_loja').update({ canvas: edEvent.canvas || [] }).eq('id', edEvent.id);
    if (error) { showToast('Erro ao salvar: ' + error.message, 'error'); return false; }
    const i = eventosLoja.findIndex(x => x.id === edEvent.id);
    if (i >= 0) eventosLoja[i].canvas = edEvent.canvas;
  }
  const s = document.getElementById('ed-canvas-save');
  if (s) { s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1800); }
  return true;
}

// ── PLANEJADO POR DIA (colunas do quadro → dias reais) ─
const DIAS_TPL = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

function _planejadoPorDia(board) {
  const out = {};
  if (!board || !board.canvas) return out;
  const [y, m, d] = board.data.split('-').map(Number);
  board.canvas.forEach(el => {
    if (el.type === 'add') return;
    const txt = (el.content || '').trim();
    const cheio = (el.url && el.url.trim()) || txt
      || (el.items || []).some(i => (i.t || '').trim())
      || (el.q || '').trim()
      || (el.opts || []).some(o => (o.t || '').trim());
    if (!cheio) return;
    // ignora os cabeçalhos do modelo (título e nomes dos dias)
    if (/^planejamento semanal$/i.test(txt)) return;
    if (DIAS_TPL.some(n => n.toLowerCase() === txt.toLowerCase())) return;
    const col = Math.round(((el.x || 0) - 40) / 240);
    if (col < 0 || col > 5) return;
    const ds = iso(new Date(y, m - 1, d + col));
    (out[ds] = out[ds] || []).push(el);
  });
  return out;
}

let planoDataAtual = null;

function abrirPlanoDia(dataStr, planos) {
  planoDataAtual = dataStr;
  const [y, m, d] = dataStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  document.getElementById('plano-titulo').textContent =
    `Planejado — ${DOWS[dt.getDay()]} ${d}/${m}`;
  const list = document.getElementById('plano-list');
  // agrupa os módulos da coluna em posts: cada foto/vídeo/enquete abre um post
  // e puxa os textos e checklists que vêm logo depois
  const ordenados = [...planos].sort((a, b) => (a.y || 0) - (b.y || 0));
  const isMedia = e => (e.type === 'video' || e.type === 'photo') && e.url;
  const isTexto = e => (e.type === 'text' || e.type === 'postit') && (e.content || '').trim();
  const temConteudo = e => isMedia(e) || isTexto(e)
    || (e.type === 'checklist' && (e.items || []).some(i => (i.t || '').trim()))
    || (e.type === 'enquete' && ((e.q || '').trim() || (e.opts || []).some(o => (o.t || '').trim())));
  const posts = [];
  ordenados.filter(temConteudo).forEach(el => {
    if (isMedia(el) || el.type === 'enquete' || !posts.length) posts.push([el]);
    else posts[posts.length - 1].push(el);
  });

  const textoHTML = el => el.type === 'postit'
    ? `<div class="plano-mod-postit" style="background:${el.color || '#fef3a7'}">${el.content}</div>`
    : `<div class="plano-post-texto">${el.content}</div>`;
  const ckHTML = el => {
    const its = (el.items || []).filter(i => (i.t || '').trim());
    const feitos = its.filter(i => i.done).length;
    return `<div class="plano-post-ck">
      <div class="plano-post-ck-head">
        <div class="cn-card-head" style="margin-bottom:0"><i class="ti ti-list-check"></i> Checklist</div>
        <div class="plano-post-ck-prog">${feitos}/${its.length}</div>
      </div>` +
      its.map(i => `<div class="ck-row"><span class="ck-box${i.done ? ' done' : ''}"><i class="ti ti-check"></i></span><div class="ck-txt${i.done ? ' done' : ''}">${_esc(i.t)}</div></div>`).join('') + `</div>`;
  };
  const enqHTML = el => {
    const ops = (el.opts || []).filter(o => (o.t || '').trim());
    const q = (el.q || '').trim();
    return (q ? `<div class="pq-q">${_esc(q)}</div>` : '') +
      ops.map((o, i) => `<div class="pq-row"><span class="pq-letra">${String.fromCharCode(65 + i)}</span><div class="pq-txt">${_esc(o.t)}</div></div>`).join('');
  };

  list.innerHTML = posts.map((p, n) => {
    const media = p.find(isMedia);
    const textos = p.filter(isTexto);
    const cks = p.filter(e => e.type === 'checklist');
    const enqs = p.filter(e => e.type === 'enquete');
    const tipo = media
      ? (media.type === 'photo' ? '<i class="ti ti-photo"></i> Foto' : '<i class="ti ti-video"></i> Vídeo')
      : (enqs.length ? '<i class="ti ti-chart-bar"></i> Enquete' : '<i class="ti ti-letter-t"></i> Texto');
    let corpo = '';
    if (media && media.type === 'photo') {
      corpo += textos.length
        ? `<div class="plano-post-row"><img class="plano-post-img" src="${media.url}">${textoHTML(textos[0])}</div>` +
          textos.slice(1).map(textoHTML).join('')
        : `<img class="plano-post-img" src="${media.url}">`;
    } else if (media) {
      corpo += _renderVideoPreview(media.url) + textos.map(textoHTML).join('');
    } else {
      corpo += textos.map(textoHTML).join('');
    }
    corpo += enqs.map(enqHTML).join('');
    corpo += cks.map(ckHTML).join('');
    return `<div class="plano-post">
      <div class="plano-post-head">
        <div class="plano-post-num">POST ${n + 1}</div>
        <div class="plano-post-tipo">${tipo}</div>
      </div>${corpo}</div>`;
  }).join('') || '<div class="empty">Nada planejado para este dia</div>';
  const cnt = document.getElementById('plano-count');
  if (cnt) cnt.textContent = posts.length ? posts.length + (posts.length > 1 ? ' posts' : ' post') : '';
  openModal('modal-plano');
}

function abrirQuadroDaData(dataStr) {
  if (!dataStr) return;
  const [y, m, d] = dataStr.split('-').map(Number);
  abrirPlanejamentoSemanal(new Date(y, m - 1, d));
}

function _planejadoMap() {
  const map = {};
  eventosLoja.filter(e => e.titulo === 'Planejamento semanal').forEach(b => {
    const porDia = _planejadoPorDia(b);
    Object.keys(porDia).forEach(ds => { (map[ds] = map[ds] || []).push(...porDia[ds]); });
  });
  return map;
}

// ── TEMPLATE: PLANEJAMENTO SEMANAL ────────────────────
// abre (ou cria) o quadro de planejamento da semana — base opcional (Date)
function abrirPlanejamentoSemanal(base) {
  const seg = (base instanceof Date) ? new Date(base) : new Date();
  seg.setDate(seg.getDate() - ((seg.getDay() + 6) % 7)); // segunda-feira da semana
  const dataStr = iso(seg);
  let ev = eventosLoja.find(e => e.titulo === 'Planejamento semanal' && e.data === dataStr);
  if (!ev) {
    ev = { data: dataStr, titulo: 'Planejamento semanal', descricao: null, cor: '#5b4fcf', tipo: 'loja', canvas: [] };
  }
  // quadros antigos (seg–sex): ganham a coluna de sábado
  if (ev.canvas && ev.canvas.length) {
    const temSab = ev.canvas.some(e => (e.content || '').trim().toLowerCase() === 'sábado');
    const sexta = ev.canvas.find(e => (e.content || '').trim().toLowerCase() === 'sexta-feira');
    if (!temSab && sexta) {
      ev.canvas.push({ id: _uid(), type: 'text', x: PLAN_X0 + 5 * PLAN_COLW + 10, y: sexta.y, w: 170, h: 36,
        content: 'Sábado', bold: true, fs: 16, hl: true, hlc: '110,225,120', color: '' });
      ev.canvas.push({ id: _uid(), type: 'add', x: PLAN_X0 + 5 * PLAN_COLW, y: (sexta.y || 90) + 60, w: 190, h: 40 });
    }
  }
  const idx = _evCache.push(ev) - 1;
  openEventDetail(idx);
  if (!ev.canvas || !ev.canvas.length) inserirTemplateSemanal();
  // subtítulo com o intervalo da semana (segunda a sábado)
  const sab = new Date(seg); sab.setDate(seg.getDate() + 5);
  const f = dt => `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}`;
  document.getElementById('ed-sub').textContent = `Semana ${f(seg)} – ${f(sab)}`;
}

// quadro sem nenhum conteúdo do usuário (só o modelo)
function _quadroPristino(ev) {
  return !(ev.canvas || []).some(el => {
    if (el.type === 'add') return false;
    if (el.url && el.url.trim()) return true;
    if ((el.items || []).some(i => (i.t || '').trim())) return true;
    if ((el.q || '').trim() || (el.opts || []).some(o => (o.t || '').trim())) return true;
    const txt = (el.content || '').trim();
    if (!txt) return false;
    if (/^planejamento semanal$/i.test(txt)) return false;
    if (DIAS_TPL.some(n => n.toLowerCase() === txt.toLowerCase())) return false;
    return true;
  });
}

function zerarSemana() {
  if (!edEvent || !_modoPlanejamento()) return;
  if (!confirm('Zerar o planejamento desta semana? Todos os módulos serão apagados.')) return;
  edEvent.canvas = [];
  edSelectedId = null;
  _showFmtbar(null);
  inserirTemplateSemanal(); // recria só a estrutura (dias + botões +) e salva se já existe registro
  edPanX = 0; edPanY = 0; _applyPan();
  showToast('Planejamento da semana zerado');
}

// copia a estrutura da semana anterior: tipos de módulo por dia,
// checklists com itens desmarcados, textos mantidos, fotos/vídeos/enquetes vazios
function copiarSemanaAnterior() {
  if (!edEvent || !_modoPlanejamento()) return;
  const [y, m, d] = edEvent.data.split('-').map(Number);
  const dataAnt = iso(new Date(y, m - 1, d - 7));
  const ant = eventosLoja.find(e => e.titulo === 'Planejamento semanal' && e.data === dataAnt);
  if (!ant || _quadroPristino(ant)) { showToast('A semana anterior não tem planejamento'); return; }
  if (!_quadroPristino(edEvent) &&
      !confirm('Substituir o planejamento atual pela estrutura da semana anterior?')) return;
  const isHeader = e => e.type === 'text' &&
    DIAS_TPL.some(n => n.toLowerCase() === (e.content || '').trim().toLowerCase());
  const isTitulo = e => e.type === 'text' && /^planejamento semanal$/i.test((e.content || '').trim());
  edEvent.canvas = [];
  edSelectedId = null;
  _showFmtbar(null);
  inserirTemplateSemanal();
  (ant.canvas || []).forEach(e => {
    if (e.type === 'add' || isHeader(e) || isTitulo(e)) return;
    const novo = { id: _uid(), type: e.type, x: e.x, y: e.y, w: e.w || 190, h: e.h || 170, content: '', color: e.color || '' };
    if (e.type === 'checklist') novo.items = (e.items || []).map(i => ({ t: i.t, done: false }));
    if (e.type === 'enquete') { novo.q = ''; novo.opts = (e.opts || []).map(() => ({ t: '' })); }
    if (e.type === 'text' || e.type === 'postit') {
      novo.content = e.content;
      ['font','fs','bold','align','lh','tc','hl','hlc'].forEach(k => { if (e[k] !== undefined) novo[k] = e[k]; });
    }
    edEvent.canvas.push(novo);
  });
  _renderCanvas();
  _scheduleCanvasSave();
  edPanX = 0; edPanY = 0; _applyPan();
  showToast('Estrutura da semana anterior copiada!');
}

async function mudarSemana(delta) {
  if (!edEvent || !_modoPlanejamento()) return;
  clearTimeout(edCanvasSaveTimer);
  // salva a semana atual antes de trocar (se tem registro ou conteúdo)
  if (edEvent.id || !_quadroPristino(edEvent)) await _saveCanvas();
  const [y, m, d] = edEvent.data.split('-').map(Number);
  abrirPlanejamentoSemanal(new Date(y, m - 1, d + delta * 7));
}

function inserirTemplateSemanal() {
  if (!edEvent) return;
  if (!edEvent.canvas) edEvent.canvas = [];
  // evita empilhar modelos sem querer
  if (edEvent.canvas.some(e => (e.content || '').trim().toLowerCase() === 'planejamento semanal')) {
    if (!confirm('Este quadro já tem o modelo da semana. Adicionar outro modelo embaixo?')) return;
  }
  // se o canvas já tem conteúdo, monta o modelo abaixo do que existe
  const baseY = edEvent.canvas.length
    ? Math.max(...edEvent.canvas.map(e => (e.y || 0) + (e.h || 200))) + 80
    : 20;
  const DIAS = DIAS_TPL;
  const COL_W = 240, X0 = 40;
  const els = [];
  els.push({ id: _uid(), type: 'text', x: X0 + (DIAS.length * COL_W) / 2 - 130, y: baseY,
    w: 260, h: 44, content: 'Planejamento semanal', bold: true, fs: 20, align: 'center',
    hl: true, hlc: '255,210,50', color: '' });
  DIAS.forEach((dia, i) => {
    const x = X0 + i * COL_W;
    els.push({ id: _uid(), type: 'text', x: x + 10, y: baseY + 70,
      w: 170, h: 36, content: dia, bold: true, fs: 16,
      hl: true, hlc: '110,225,120', color: '' });
    els.push({ id: _uid(), type: 'add', x, y: baseY + 130, w: 190, h: 40 });
  });
  edEvent.canvas.push(...els);
  _renderCanvas();
  // só persiste se o quadro já existe no banco — visitar uma semana nova não cria registro
  if (edEvent.id) _scheduleCanvasSave();
  selectTool('cursor');
  showToast('Modelo de planejamento semanal adicionado!');
}

// ── MÓDULOS EMPILHADOS (botão + da coluna) ────────────
function toggleAddMenu(id) {
  document.querySelectorAll('.cn-add-menu').forEach(m => {
    if (m.id !== 'addmenu-' + id) m.classList.remove('open');
  });
  document.querySelectorAll('.cn-add').forEach(w => w.style.zIndex = '');
  const menu = document.getElementById('addmenu-' + id);
  if (!menu) return;
  const abriu = menu.classList.toggle('open');
  const wrap = menu.closest('.cn-el');
  if (abriu && wrap) {
    wrap.style.zIndex = 60; // menu acima de qualquer módulo vizinho
    // perto do fundo da tela: abre o menu para cima para não cortar
    const canvasRect = document.getElementById('ed-canvas').getBoundingClientRect();
    const espacoAbaixo = canvasRect.bottom - wrap.getBoundingClientRect().bottom;
    menu.classList.toggle('up', espacoAbaixo < 280);
  }
}

function addModulo(addId, tipo) {
  if (!edEvent || !edEvent.canvas) return;
  const add = edEvent.canvas.find(x => x.id === addId);
  if (!add) return;
  const h = tipo === 'text' ? 60 : 170; // checklist e enquete abrem no tamanho padrão das caixas de foto/vídeo
  // + de reposição pode ter herdado largura estreita de uma caixa excluída — módulo novo nunca abre menor que o padrão
  const el = { id: _uid(), type: tipo, x: add.x, y: add.y, w: Math.max(add.w || 190, 170), h, content: '', color: '' };
  if (tipo === 'checklist') el.items = [{ t: '', done: false }];
  if (tipo === 'enquete') el.opts = [{ t: '' }, { t: '' }];
  edEvent.canvas.push(el);
  if (add.once) edEvent.canvas = edEvent.canvas.filter(x => x.id !== add.id); // + de reposição: usa uma vez e some
  else add.y += h + 16; // + da coluna desce para baixo do módulo novo
  _renderCanvas();
  _scheduleCanvasSave();
  _ensureVisible(add); // rola a tela para mostrar o módulo novo e o +
  setTimeout(() => {
    const node = document.querySelector(`[data-id="${el.id}"] .cn-content`);
    if (node && tipo === 'text') { node.contentEditable = 'true'; node.focus(); }
    const vin = document.querySelector(`[data-id="${el.id}"] .cn-video-input`);
    if (vin) vin.focus();
    const foco = document.querySelector(`[data-id="${el.id}"] .ck-txt, [data-id="${el.id}"] .pq-q`);
    if (foco) foco.focus();
  }, 30);
}

// ── CHECKLIST E ENQUETE ───────────────────────────────
function _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _cardEl(id) { return edEvent && edEvent.canvas ? edEvent.canvas.find(x => x.id === id) : null; }

// tamanho real do card (muda com os itens) — usado no empilhamento e no pan
function _syncCardH(id) {
  const wrap = document.querySelector(`[data-id="${id}"]`);
  const el = _cardEl(id);
  if (wrap && el) { el.h = wrap.offsetHeight; el.w = wrap.offsetWidth; }
  _reflowPlanejamento();
}

// planejamento: reempilha cada coluna abaixo do nome do dia —
// módulos ficam fixos na coluna e só empurram o que está embaixo
const PLAN_X0 = 40, PLAN_COLW = 240, PLAN_GAP = 14;

// selos de comemorativa/campanha abaixo do nome de cada dia (decoração, não salva no canvas)
let _planBadgeH = {};
function _renderPlanBadges() {
  _planBadgeH = {};
  if (!_modoPlanejamento() || !edEvent) return;
  const world = document.getElementById('ed-world');
  const [y0, m0, d0] = edEvent.data.split('-').map(Number);
  const isHeader = e => e.type === 'text' &&
    DIAS_TPL.some(n => n.toLowerCase() === (e.content || '').trim().toLowerCase());
  (edEvent.canvas || []).filter(isHeader).forEach(h => {
    const col = Math.min(5, Math.max(0, Math.round(((h.x || 0) - 10 - PLAN_X0) / PLAN_COLW)));
    const dt = new Date(y0, m0 - 1, d0 + col);
    const ds = iso(dt);
    const badges = [];
    getComemorativas(dt.getFullYear()).filter(c => c.data === ds)
      .forEach(c => badges.push({ ic: 'ti-calendar-star', txt: c.titulo, cls: 'comemorativa' }));
    campanhas.filter(c => c.data_campanha === ds)
      .forEach(c => badges.push({ ic: 'ti-speakerphone', txt: c.titulo, cls: 'campanha' }));
    if (!badges.length) return;
    const div = document.createElement('div');
    div.className = 'plan-badges';
    div.style.left = (PLAN_X0 + col * PLAN_COLW) + 'px';
    div.style.top = ((h.y || 0) + (h.h || 36) + 6) + 'px';
    div.innerHTML = badges.map(b =>
      `<div class="plan-badge ${b.cls}"><i class="ti ${b.ic}"></i><span>${_esc(b.txt)}</span></div>`).join('');
    world.appendChild(div);
    _planBadgeH[col] = badges.length * 25 + 4;
  });
}
function _reflowPlanejamento() {
  if (!_modoPlanejamento() || !edEvent || !edEvent.canvas) return;
  const isHeader = e => e.type === 'text' &&
    DIAS_TPL.some(n => n.toLowerCase() === (e.content || '').trim().toLowerCase());
  const isTitulo = e => e.type === 'text' && /^planejamento semanal$/i.test((e.content || '').trim());
  // base de cada coluna = logo abaixo do cabeçalho do dia
  const baseY = {};
  edEvent.canvas.filter(isHeader).forEach(h => {
    const col = Math.min(5, Math.max(0, Math.round(((h.x || 0) - 10 - PLAN_X0) / PLAN_COLW)));
    baseY[col] = Math.max(baseY[col] || 0, (h.y || 0) + (h.h || 36) + 18);
  });
  // selos de comemorativa/campanha abaixo do cabeçalho empurram a coluna
  Object.keys(baseY).forEach(c => baseY[c] += (_planBadgeH[c] || 0));
  // agrupa módulos por coluna (botão + sempre por último)
  const cols = {};
  edEvent.canvas.forEach(e => {
    if (isHeader(e) || isTitulo(e)) return;
    const col = Math.min(5, Math.max(0, Math.round(((e.x || 0) - PLAN_X0) / PLAN_COLW)));
    (cols[col] = cols[col] || []).push(e);
  });
  Object.keys(cols).forEach(col => {
    const fila = cols[col].sort((a, b) =>
      (a.type === 'add') - (b.type === 'add') || (a.y || 0) - (b.y || 0));
    let y = baseY[col] !== undefined ? baseY[col] : 130;
    fila.forEach(e => {
      e.x = PLAN_X0 + col * PLAN_COLW;
      e.y = y;
      const node = document.querySelector(`[data-id="${e.id}"]`);
      if (node) { node.style.left = e.x + 'px'; node.style.top = e.y + 'px'; }
      y += (e.h || 170) + PLAN_GAP;
    });
  });
}

function _focusCardField(id, cls, idx) {
  setTimeout(() => {
    const n = document.querySelectorAll(`[data-id="${id}"] ${cls}`)[idx];
    if (n) n.focus();
  }, 30);
}

function ckToggle(id, i) {
  const el = _cardEl(id); if (!el || !el.items || !el.items[i]) return;
  el.items[i].done = !el.items[i].done;
  _renderCanvas();
  _scheduleCanvasSave();
}
function ckSaveItem(id, i, node) {
  const el = _cardEl(id); if (!el || !el.items || !el.items[i]) return;
  el.items[i].t = node.textContent;
  _syncCardH(id);
  _scheduleCanvasSave();
}
function ckAddItem(id) {
  const el = _cardEl(id); if (!el) return;
  (el.items = el.items || []).push({ t: '', done: false });
  _renderCanvas();
  _scheduleCanvasSave();
  _focusCardField(id, '.ck-txt', el.items.length - 1);
}
function ckDelItem(id, i) {
  const el = _cardEl(id); if (!el || !el.items) return;
  el.items.splice(i, 1);
  if (!el.items.length) el.items.push({ t: '', done: false });
  _renderCanvas();
  _scheduleCanvasSave();
}
function ckKey(e, id, i) {
  if (e.key === 'Enter') {
    e.preventDefault();
    ckSaveItem(id, i, e.target);
    ckAddItem(id);
  }
}

function pqSaveQ(id, node) {
  const el = _cardEl(id); if (!el) return;
  el.q = node.textContent;
  _syncCardH(id);
  _scheduleCanvasSave();
}
function pqSaveOpt(id, i, node) {
  const el = _cardEl(id); if (!el || !el.opts || !el.opts[i]) return;
  el.opts[i].t = node.textContent;
  _syncCardH(id);
  _scheduleCanvasSave();
}
function pqAddOpt(id) {
  const el = _cardEl(id); if (!el) return;
  (el.opts = el.opts || []).push({ t: '' });
  _renderCanvas();
  _scheduleCanvasSave();
  _focusCardField(id, '.pq-txt', el.opts.length - 1);
}
function pqDelOpt(id, i) {
  const el = _cardEl(id); if (!el || !el.opts) return;
  el.opts.splice(i, 1);
  while (el.opts.length < 2) el.opts.push({ t: '' });
  _renderCanvas();
  _scheduleCanvasSave();
}
function pqKey(e, id, i) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  pqSaveOpt(id, i, e.target);
  const el = _cardEl(id);
  if (el && i === el.opts.length - 1) pqAddOpt(id);
  else _focusCardField(id, '.pq-txt', i + 1);
}

// rola o canvas (pan) até o elemento ficar visível na tela
function _ensureVisible(el) {
  const canvas = document.getElementById('ed-canvas');
  const world = document.getElementById('ed-world');
  const ch = canvas.clientHeight;
  const margem = 20;
  const topo = el.y + edPanY;
  const fundo = el.y + (el.h || 100) + edPanY;
  let novoPanY = edPanY;
  if (fundo + margem > ch) novoPanY = edPanY - (fundo + margem - ch);
  else if (topo < margem) novoPanY = edPanY + (margem - topo);
  if (novoPanY === edPanY) return;
  edPanY = novoPanY;
  world.style.transition = 'transform .25s ease';
  canvas.style.transition = 'background-position .25s ease';
  _applyPan();
  setTimeout(() => { world.style.transition = ''; canvas.style.transition = ''; }, 300);
}

function setCanalPill(btn) {
  document.querySelectorAll('.camp-canal-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('camp-canal').value = btn.dataset.canal;
}
function setStatusPill(btn) {
  document.querySelectorAll('.camp-status-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('camp-status').value = btn.dataset.status;
}
function detectVideoIco(inp) {
  const el = document.getElementById('camp-video-ico');
  if (inp.value.includes('tiktok')) el.textContent = '♪';
  else if (inp.value.includes('youtube') || inp.value.includes('youtu.be')) el.textContent = '▶';
  else el.innerHTML = '&#128279;';
}
function _syncPillsFromModal() {
  const canal = document.getElementById('camp-canal').value;
  const status = document.getElementById('camp-status').value;
  document.querySelectorAll('.camp-canal-pill').forEach(b => b.classList.toggle('active', b.dataset.canal===canal));
  document.querySelectorAll('.camp-status-pill').forEach(b => b.classList.toggle('active', b.dataset.status===status));
  const ta = document.getElementById('camp-ideia');
  if (ta) document.getElementById('camp-ideia-count').textContent = ta.value.length;
}

}

function _renderVideoPreview(url) {
  if (!url) return '';

  if (yt) {
    const id = yt[1];
    return `<div class="camp-video-label">Refer\u00eancia</div>
<div class="camp-video-thumb" onclick="window.open('${url}','_blank')">
  <img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" alt="">
  ${playBtn}
  <div class="camp-video-source-tag">YouTube</div>
</div>`;
  }

  // TikTok \u2014 thumbnail via oEmbed (API p\u00fablica, sem token)
  if (url.includes('tiktok.com') || url.includes('vm.tiktok')) {
    const pid = 'ttk' + Date.now().toString(36);
    setTimeout(() => {
      fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url))
        .then(r => r.json())

          }

function _renderAcoesLoja(campId, loja, nome, dotClass, acoes) {
  const list = (acoes && acoes[loja]) || [];
  const items = list.map((a, i) => `<div class="camp-acao-item" onclick="toggleAcao('${campId}','${loja}',${i})">
    <div class="camp-acao-check${a.done?' done':''}">${a.done?'\u2713':''}</div>
    <span class="camp-acao-text${a.done?' done':''}">${a.text}</span>
  </div>`).join('');
  return `<div>
  <div class="camp-acoes-loja-title"><div class="camp-acoes-loja-dot ${dotClass}"></div>${nome}</div>
  ${items}
  <button class="camp-add-acao" onclick="showAddAcao(this,'${campId}','${loja}')"><div class="camp-add-acao-icon">+</div> Adicionar</button>
</div>`;
}

function _campanhaCardHTML(c) {
  const sLabel = { rascunho:'Rascunho', aprovada:'Aprovada', publicada:'Publicada' };
  const cc = _canalClass(c.canal);
  const [,m,d] = c.data_campanha.split('-');
  return `<div class="campanha-card ${cc}">
    <button class="camp-del" onclick="deletarCampanha('${c.id}')">\u2715</button>
    <div class="camp-top-row">
      <div class="camp-canal-tag ${cc}">${_canalIconSVG(c.canal)} ${c.canal}</div>
      <div class="camp-status-indicator status-${c.status}">${sLabel[c.status]||c.status}</div>
    </div>
    <div class="camp-label-titulo">${c.titulo} <span style="color:#444;font-size:.7rem">${parseInt(d)}/${parseInt(m)}</span></div>
    ${c.ideia ? `<div class="camp-ideia-text">&ldquo;${c.ideia}&rdquo;</div>` : ''}
    ${_renderVideoPreview(c.video_link)}
    <div class="camp-acoes-section">
      ${_renderAcoesLoja(c.id,'areal','Areal','areal',c.acoes||{})}
      ${_renderAcoesLoja(c.id,'trios','Tr\u00eas Rios','trios',c.acoes||{})}
    </div>
    <button class="camp-edit-btn" onclick="abrirCampanha('${c.data_campanha}','${c.id}')">&#9999; Editar</button>
  </div>`;
}

function renderCampanhaCards(elId, camps, append=false) {
  const el = document.getElementById(elId);
  const full = `<div class="camp-section-title">&#9670; Campanhas (${camps.length})</div>${camps.map(_campanhaCardHTML).join('')}`;
  if (append) el.insertAdjacentHTML('beforeend', full);
  else el.innerHTML = full;
}

async function toggleAcao(campId, loja, idx) {
  const c = campanhas.find(x => x.id === campId);
  if (!c) return;
  const acoes = JSON.parse(JSON.stringify(c.acoes || {}));
  if (!acoes[loja]) acoes[loja] = [];
  acoes[loja][idx].done = !acoes[loja][idx].done;
  c.acoes = acoes;
  await sb.from('campanhas').update({ acoes }).eq('id', campId);
  if (currentView === 'campanhas') { renderView(); }
  else if (diaAberto) { showDayEvents(diaAberto, parseInt(diaAberto.split('-')[2])); }
}

function showAddAcao(btn, campId, loja) {
  const parent = btn.parentElement;
  btn.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'camp-acao-input-row';
  row.innerHTML = `<input class="camp-acao-input" type="text" placeholder="Descrever a a\u00e7\u00e3o...">
    <button class="camp-acao-save-btn" onclick="saveNewAcao(this,'${campId}','${loja}')">OK</button>`;
  parent.appendChild(row);
  const inp = row.querySelector('input');
  inp.focus();
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter') row.querySelector('button').click();
    if (e.key==='Escape') { row.remove(); btn.style.display=''; }
  });
}

async function saveNewAcao(btn, campId, loja) {
  const input = btn.previousElementSibling;
  const text = input.value.trim();
  if (!text) return;
  const c = campanhas.find(x => x.id === campId);
  if (!c) return;
  const acoes = JSON.parse(JSON.stringify(c.acoes || {}));
  if (!acoes[loja]) acoes[loja] = [];
  acoes[loja].push({ text, done: false });
  c.acoes = acoes;
  btn.textContent = '...';
  await sb.from('campanhas').update({ acoes }).eq('id', campId);
  await loadEventosLoja();
  if (diaAberto) { showDayEvents(diaAberto, parseInt(diaAberto.split('-')[2])); }
}

function abrirCampanha(data, id) {
  campEditId = id || null;
  document.getElementById('camp-data').value = data || '';
  if (id) {
    const c = campanhas.find(x => x.id === id);
    if (c) {
      document.getElementById('camp-titulo').value = c.titulo || '';
      document.getElementById('camp-canal').value  = c.canal  || 'Instagram';
      document.getElementById('camp-ideia').value  = c.ideia  || '';
      document.getElementById('camp-video').value  = c.video_link || '';
      document.getElementById('camp-status').value = c.status || 'rascunho';
    }
  } else {
    ['camp-titulo','camp-ideia','camp-video'].forEach(i => document.getElementById(i).value='');
    document.getElementById('camp-canal').value  = 'Instagram';
    document.getElementById('camp-status').value = 'rascunho';
  }
  _syncPillsFromModal();
  openModal('modal-campanha');
}

async function salvarCampanha() {
  const data_campanha = document.getElementById('camp-data').value;
  const titulo     = document.getElementById('camp-titulo').value.trim();
  const canal      = document.getElementById('camp-canal').value;
  const ideia      = document.getElementById('camp-ideia').value.trim();
  const video_link = document.getElementById('camp-video').value.trim();
  const status     = document.getElementById('camp-status').value;
  if (!data_campanha || !titulo) { showToast('Preencha data e t\u00edtulo','error'); return; }
  let error;
  if (campEditId) {
    ({ error } = await sb.from('campanhas').update({ titulo, canal, ideia:ideia||null, video_link:video_link||null, status }).eq('id', campEditId));
  } else {
    ({ error } = await sb.from('campanhas').insert({ data_campanha, titulo, canal, ideia:ideia||null, video_link:video_link||null, status }));
  }
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  closeModal('modal-campanha');
  campEditId = null;
  await loadEventosLoja();
  if (diaAberto) { showDayEvents(diaAberto, parseInt(diaAberto.split('-')[2])); }
  showToast('Campanha salva!');
}

async function deletarCampanha(id) {
  if (!confirm('Remover esta campanha?')) return;
  await sb.from('campanhas').delete().eq('id', id);
  await loadEventosLoja();
  if (diaAberto) { showDayEvents(diaAberto, parseInt(diaAberto.split('-')[2])); }
  showToast('Campanha removida');
}

// ===== MODAL =====
function openModal(id)  {
  document.getElementById(id).classList.add('open');
  if (id === 'modal-add') initColorPicker();
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function limparModal() {
  ['ev-data','ev-titulo','ev-desc'].forEach(id => document.getElementById(id).value='');
  corSelecionada = CORES[0].hex;
  initColorPicker();
}
document.querySelectorAll('.modal-overlay').forEach(m =>
  m.addEventListener('click', e => { if (e.target===m) m.classList.remove('open'); })
);

// ===== TOOLTIP =====
const tooltip = document.getElementById('cal-tooltip');
let tooltipTimer = null;

function showTooltip(e, evs) {
  if (!evs.length) return;
  clearTimeout(tooltipTimer);
  tooltip.innerHTML = evs.map((ev, i) => {
    const c = ev.cor || (ev.tipo==='loja' ? 'var(--accent)' : 'var(--yellow)');
    return `${i > 0 ? '<hr class="tooltip-sep">' : ''}
      <div class="tooltip-item">
        <div class="tooltip-dot" style="background:${c}"></div>
        <span>${ev.titulo}</span>
      </div>`;
  }).join('');
  tooltip.classList.add('visible');
  positionTooltip(e);
}

function positionTooltip(e) {
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + tw > window.innerWidth - 8)  x = e.clientX - tw - 12;
  if (y + th > window.innerHeight - 8) y = e.clientY - th - 12;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() {
  tooltipTimer = setTimeout(() => tooltip.classList.remove('visible'), 80);
}

document.addEventListener('mousemove', e => {
  if (tooltip.classList.contains('visible')) positionTooltip(e);
});

function showTooltipMini(e, dataStr) {
  const evs = allEventos(viewYear).filter(ev => ev.data===dataStr);
  showTooltip(e, evs);
}

// ===== TOAST =====
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  setTimeout(() => t.className='', 3000);
}

// ===== BOOT =====
setView('mensal');
loadEventosLoja();
