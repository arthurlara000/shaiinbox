<style>
:root {
  --bg: #f4f2ee;
  --surface: #faf9f6;
  --surface2: #ede9e2;
  --border: #dbd5cc;
  --text: #1a1814;
  --text-muted: #9a9490;
  --accent: #5b4fcf;
  --green: #3a9a6a;
  --red: #c44848;
  --yellow: #b87830;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom, 24px)); }

/* HEADER */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.header-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--accent); }
.header-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
.add-btn {
  background: var(--accent); color: var(--bg); border: none;
  border-radius: 50%; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.15rem; cursor: pointer;
}

/* PERIOD NAV */
.period-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; max-width: 480px; margin: 0 auto;
}
.period-label { font-size: 1rem; font-weight: 600; }
.nav-arrow {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); font-size: 1rem;
}
.nav-arrow:active { opacity: 0.6; }
.period-controls { display: flex; gap: 8px; align-items: center; }
.view-toggle {
  display: flex; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
.view-toggle button {
  border: none; background: none; padding: 6px 13px;
  font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
  cursor: pointer; font-family: inherit;
}
.view-toggle button.active { background: var(--accent); color: var(--bg); }

/* ── MENSAL ─────────────────────────────── */
.cal-wrap { padding: 0 10px; max-width: 480px; margin: 0 auto; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 1px; margin-bottom: 20px;
  border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  background: var(--border);
}
.cal-dow {
  text-align: center; font-size: 0.58rem; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em;
  padding: 7px 0; background: var(--surface);
}
.cal-day {
  min-height: 62px; display: flex; flex-direction: column; align-items: flex-start;
  padding: 5px 3px 3px; background: var(--surface2); cursor: pointer; gap: 2px;
  transition: background 0.12s;
}
.cal-day:active { background: var(--surface); }
.cal-day.empty { cursor: default; background: var(--bg); }
.cal-day.today { background: color-mix(in srgb, var(--accent) 9%, var(--surface2)); }
.cal-day.today .day-num {
  background: var(--accent); color: var(--bg); border-radius: 50%;
  width: 19px; height: 19px; display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.day-num {
  font-size: 0.72rem; color: var(--text-muted);
  min-width: 22px; height: 16px; padding: 0 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-radius: 999px; transition: background 0.15s;
}
.ev-pill {
  width: 100%; border-radius: 3px; padding: 1px 4px;
  font-size: 0.56rem; font-weight: 600; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ev-pill.comemorativa { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow); }
.ev-pill.loja         { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
.ev-pill.more         { background: none; color: var(--text-muted); font-size: 0.52rem; padding: 0 4px; }
.ev-pill.plano        { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.ev-pill.plano i      { font-size: 0.5rem; }

/* ── ANUAL ─────────────────────────────── */
#view-anual { padding: 0 10px; max-width: 480px; margin: 0 auto; display: none; }
.year-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 20px;
}
.mini-month { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; }
.mini-month-title {
  font-size: 0.7rem; font-weight: 700; color: var(--accent);
  text-align: center; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em;
}
.mini-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
}
.mini-dow {
  font-size: 0.44rem; color: var(--text-muted); text-align: center;
  text-transform: uppercase; padding: 2px 0; font-weight: 600;
}
.mini-day {
  font-size: 0.5rem; text-align: center; padding: 2px 3px;
  border-radius: 999px; cursor: pointer; color: var(--text-muted); position: relative;
}
.mini-day:active { background: var(--surface2); }
.mini-day.today-mini { background: var(--accent); color: var(--bg); border-radius: 50%; font-weight: 700; }
.mini-day.has-ev { color: var(--text); font-weight: 600; }
.mini-day.has-ev::after {
  content: ''; display: block; width: 3px; height: 3px; border-radius: 50%;
  background: var(--dot-cor, var(--yellow)); margin: 1px auto 0;
}

/* TOOLTIP */
.cal-tooltip {
  position: fixed; z-index: 500;
  background: #fff; border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  pointer-events: none; opacity: 0;
  transition: opacity 0.15s;
  max-width: 220px; min-width: 140px;
}
.cal-tooltip.visible { opacity: 1; }
.tooltip-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.76rem; font-weight: 500; line-height: 1.4;
  padding: 2px 0;
}
.tooltip-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.tooltip-sep { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

/* ── LISTA DE EVENTOS ─────────────────────────────── */
.events-wrap { padding: 0 14px; max-width: 480px; margin: 0 auto; }
.section-title {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
}
.event-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 15px; margin-bottom: 9px;
  display: flex; gap: 13px; align-items: flex-start;
}
.event-date-box {
  background: var(--surface2); border-radius: 10px;
  padding: 7px 9px; text-align: center; min-width: 44px; flex-shrink: 0;
}
.event-date-day { font-size: 1.15rem; font-weight: 700; line-height: 1; color: var(--accent); }
.event-date-mon { font-size: 0.58rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 2px; }
.event-info { flex: 1; }
.event-title { font-size: 0.88rem; font-weight: 600; margin-bottom: 2px; }
.event-desc { font-size: 0.76rem; color: var(--text-muted); }
.event-badge {
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 20px; display: inline-block; margin-top: 5px;
}
.badge-comemorativa { background: color-mix(in srgb, var(--yellow) 18%, transparent); color: var(--yellow); }
.badge-loja         { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.event-del { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 2px; }
.empty { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 32px 0; }

/* ── TELA DE DETALHE DO EVENTO ─────────────────────────────── */
/* ── TELA CANVAS ─────────────────────────────── */
#event-detail {
  position: fixed; inset: 0; z-index: 160;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  background: #f0ede8;
}
#event-detail.open { transform: translateX(0); }

/* topbar */
.ed-topbar {
  position: relative; z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.ed-back {
  background: none; border: none; color: var(--text-muted);
  font-size: 1.2rem; cursor: pointer; padding: 2px; flex-shrink: 0;
  display: flex; align-items: center;
}
.ed-back:active { opacity: 0.5; }
.ed-topbar-info { flex: 1; min-width: 0; }
.ed-topbar-title {
  font-size: 0.95rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ed-topbar-sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }
.ed-topbar-badge {
  font-size: 0.58rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
}
.ed-topbar-action {
  background: none; border: none; color: var(--text-muted);
  font-size: 1.1rem; cursor: pointer; padding: 4px 6px;
  border-radius: 8px; display: flex; align-items: center;
  flex-shrink: 0; transition: background 0.15s;
}
.ed-topbar-action:hover { background: var(--surface2); color: var(--text); }
.ed-save-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 8px 16px; margin-left: 6px;
  font-size: 0.82rem; font-weight: 600; font-family: inherit;
  cursor: pointer; flex-shrink: 0; transition: opacity .15s;
}
.ed-save-btn:hover { opacity: .88; }

/* canvas */
#ed-canvas {
  flex: 1; position: relative; overflow: hidden;
  background-color: #f0ede8;
  background-image: radial-gradient(circle, #ccc8c0 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: crosshair;
  min-height: 0;
  touch-action: none;
}
#ed-canvas.tool-cursor { cursor: default; }
#ed-world {
  position: absolute; left: 0; top: 0;
  will-change: transform;
}

/* pontilhado de pré-visualização ao desenhar */
#cn-preview {
  position: absolute; pointer-events: none; z-index: 5;
  border: 2px dashed var(--accent); border-radius: 6px;
  background: color-mix(in srgb, var(--accent) 7%, transparent);
}

/* elementos do canvas */
.cn-el {
  position: absolute;
  box-sizing: border-box; overflow: visible;
  cursor: move; user-select: none; touch-action: none;
}
.cn-el.selected {
  outline: 1.5px solid var(--accent);
  outline-offset: 0;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent),
              0 4px 16px rgba(0,0,0,.10);
}

.cn-postit {
  border-radius: 4px; padding: 10px 12px;
  box-shadow: 2px 4px 12px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.08);
  font-family: 'DM Sans', sans-serif; font-size: 0.88rem; line-height: 1.5;
  color: #1a1814;
  transform-origin: top left;
}
.cn-text {
  background: transparent; padding: 6px 8px;
  font-family: 'DM Sans', sans-serif; font-size: 0.92rem;
  line-height: 1.6; color: var(--text);
}

.cn-content {
  outline: none; width: 100%; height: 100%;
  overflow: hidden;
  white-space: pre-wrap; word-break: break-word;
}
.cn-content:empty::before { content: attr(data-ph); opacity: .45; pointer-events: none; display: block; }

/* traço de marca-texto — abraça cada linha do texto */
.cn-content.hl {
  --hlc: 255,210,50;
  display: inline;
  width: auto; height: auto;
  background-image: linear-gradient(100deg,
    rgba(var(--hlc),0) 0.6%,
    rgba(var(--hlc),.9) 2.8%,
    rgba(var(--hlc),.55) 20%,
    rgba(var(--hlc),.65) 55%,
    rgba(var(--hlc),.85) 96%,
    rgba(var(--hlc),0) 99%);
  background-repeat: no-repeat;
  background-size: 100% 72%;
  background-position: 0 58%;
  padding: 2px 8px; margin: 0 -4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.cn-del {
  position: absolute; top: -42px; left: 50%; transform: translateX(-50%);
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.14);
  transition: background .12s, color .12s, border-color .12s;
}
.cn-del:hover { background: var(--red); border-color: var(--red); color: #fff; }
.cn-el.selected .cn-del { display: flex; }
.cn-el:hover .cn-del { display: flex; }

/* moldura de vídeo/ideia */
.cn-video {
  background: #fff; border-radius: 12px; padding: 6px;
  box-shadow: 0 2px 10px rgba(0,0,0,.10);
}
.cn-video-frame {
  position: relative; width: 100%; height: 100%;
  border-radius: 8px; overflow: hidden; background: #e8e3db;
}
.cn-video-setup {
  display: flex; flex-direction: column; gap: 8px;
  align-items: center; justify-content: center;
  width: 100%; height: 100%; padding: 12px; box-sizing: border-box;
}
.cn-video-setup > i { font-size: 1.5rem; color: var(--text-muted); }
.cn-video-input {
  width: 100%; background: #fff; border: 1.5px solid var(--border);
  border-radius: 8px; padding: 7px 9px; font-size: 0.72rem;
  color: var(--text); outline: none; font-family: inherit; box-sizing: border-box;
}
.cn-video-input:focus { border-color: var(--accent); }
.cn-video-ok {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 6px 16px; font-size: 0.75rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.cn-video-play {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center; pointer-events: none;
}
.cn-video-play > div {
  pointer-events: auto; cursor: pointer;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,.92);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.28);
  transition: transform .12s;
}
.cn-video-play > div:hover { transform: scale(1.12); }
.cn-video-play svg { width: 16px; height: 16px; fill: #1a1814; margin-left: 2px; }
.cn-video-tag {
  position: absolute; bottom: 6px; left: 6px;
  background: rgba(0,0,0,.65); color: #fff;
  font-size: 0.6rem; font-weight: 600; padding: 2px 8px; border-radius: 20px;
}
.cn-video-edit {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px; border-radius: 6px;
  background: rgba(0,0,0,.55); border: none; color: #fff;
  font-size: 0.7rem; cursor: pointer; display: none;
  align-items: center; justify-content: center;
}
.cn-el.selected .cn-video-edit { display: flex; }
.cn-video-frame img { pointer-events: none; user-select: none; }
.cn-video-setup .ti-loader-2 { animation: cnspin 1s linear infinite; }
@keyframes cnspin { to { transform: rotate(360deg); } }

/* botão + de adicionar módulo na coluna */
.cn-add { cursor: default; display: flex; justify-content: center; }
.cn-add-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px dashed var(--text-muted); background: transparent;
  color: var(--text-muted); font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
}
.cn-add-btn:hover { border-color: var(--accent); color: var(--accent); }
.cn-add-menu {
  display: none; position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  flex-direction: column; z-index: 30; min-width: 160px;
}
.cn-add-menu.open { display: flex; }
.cn-add-menu.up { top: auto; bottom: 42px; }
.cn-add-opt {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border: none; background: none; border-radius: 8px;
  font-family: inherit; font-size: .82rem; color: var(--text);
  cursor: pointer; text-align: left; white-space: nowrap;
}
.cn-add-opt:hover { background: var(--surface2); }
.cn-add-opt i { color: var(--text-muted); }

/* checklist e enquete — sem moldura, só o conteúdo no quadro */
.cn-card {
  background: transparent; border-radius: 12px; padding: 4px 6px;
  min-height: 170px; min-width: 170px; box-sizing: border-box;
  font-family: 'DM Sans', sans-serif; color: #1a1814;
}
.cn-card-head {
  display: flex; align-items: center; gap: 6px;
  font-size: .62rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: #9a938a; margin-bottom: 8px;
}
.ck-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.ck-box {
  width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-top: 1px;
  border: 1.5px solid #c5bfb5; background: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: transparent; font-size: .68rem; padding: 0;
  transition: background .12s, border-color .12s;
}
.ck-box.done { background: #52b88a; border-color: #52b88a; color: #fff; }
.ck-txt {
  flex: 1; outline: none; font-size: .82rem; line-height: 1.45;
  min-height: 18px; word-break: break-word; white-space: pre-wrap;
  cursor: text; user-select: text;
}
.ck-txt.done { text-decoration: line-through; color: #a49d92; }
.ck-txt:empty::before, .pq-txt:empty::before, .pq-q:empty::before {
  content: attr(data-ph); opacity: .4; pointer-events: none;
}
.ck-rm {
  border: none; background: none; color: #c5bfb5; cursor: pointer;
  font-size: .74rem; padding: 0 2px; display: none; flex-shrink: 0; margin-top: 2px;
}
.ck-rm:hover { color: var(--red); }
.ck-row:hover .ck-rm, .pq-row:hover .ck-rm { display: block; }
.ck-add-row {
  border: none; background: none; color: #9a938a; cursor: pointer;
  font-size: .74rem; font-family: inherit; padding: 2px 0;
  display: flex; align-items: center; gap: 5px;
}
.ck-add-row:hover { color: var(--accent); }
.pq-q {
  outline: none; font-size: .86rem; font-weight: 600; line-height: 1.4;
  margin-bottom: 8px; word-break: break-word; white-space: pre-wrap;
  cursor: text; user-select: text;
}
.pq-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  background: #fff; border-radius: 20px; padding: 5px 8px 5px 5px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.pq-letra {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: color-mix(in srgb, var(--accent) 22%, #fff); color: #8a6f3f;
  font-size: .62rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.pq-txt {
  flex: 1; outline: none; font-size: .8rem; line-height: 1.4;
  min-height: 17px; word-break: break-word; white-space: pre-wrap;
  cursor: text; user-select: text;
}

/* alças de resize nos cantos */
.cn-h {
  position: absolute; width: 10px; height: 10px;
  background: #fff; border: 1.5px solid var(--accent); border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
  display: none; z-index: 6; box-sizing: border-box;
  transition: transform .1s, background .1s;
}
.cn-h:hover { transform: scale(1.35); background: var(--accent); }
.cn-el.selected .cn-h { display: block; }
.cn-h-nw { top: -5px;    left: -5px;  cursor: nw-resize; }
.cn-h-ne { top: -5px;    right: -5px; cursor: ne-resize; }
.cn-h-sw { bottom: -5px; left: -5px;  cursor: sw-resize; }
.cn-h-se { bottom: -5px; right: -5px; cursor: se-resize; }

/* planejamento: estrutura fixa — sem arrastar nem redimensionar */
.modo-plano .cn-el { cursor: default; }
.modo-plano .cn-h { display: none !important; }

/* selos de comemorativa/campanha no cabeçalho do dia */
.plan-badges {
  position: absolute; display: flex; flex-direction: column; gap: 3px;
  width: 190px; pointer-events: none; z-index: 2;
}
.plan-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: .62rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; overflow: hidden; width: fit-content; max-width: 100%;
  box-sizing: border-box;
}
.plan-badge span { overflow: hidden; text-overflow: ellipsis; }
.plan-badge i { flex-shrink: 0; }
.plan-badge.comemorativa { background: #f3e2b3; color: #7a5f1e; }
.plan-badge.campanha { background: #e2d2b4; color: #6d5423; }

/* barra de formatação */
#ed-fmtbar {
  display: none; align-items: center; gap: 8px;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 16px; flex-shrink: 0;
}
#ed-fmtbar.show { display: flex; }
#ed-fmtbar select {
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--text); font-family: inherit;
  font-size: 0.82rem; padding: 6px 8px; outline: none; cursor: pointer;
}
.fmt-font-wrap { position: relative; }
#fmt-font-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 0.82rem; padding: 6px 10px; cursor: pointer;
  min-width: 110px; justify-content: space-between;
}
#fmt-font-btn i { font-size: 0.7rem; color: var(--text-muted); }
.fmt-font-pop {
  display: none; position: absolute;
  bottom: calc(100% + 10px); left: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  flex-direction: column; z-index: 20; min-width: 180px;
}
.fmt-font-pop.open { display: flex; }
.fmt-font-opt {
  padding: 9px 12px; border-radius: 8px; cursor: pointer;
  font-size: 0.95rem; color: var(--text); white-space: nowrap;
}
.fmt-font-opt:hover { background: var(--surface2); }
.fmt-font-opt.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
#fmt-bold, #fmt-hl, #fmt-align, #fmt-lh {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--surface2);
  color: var(--text); font-weight: 800; font-size: 0.95rem;
  cursor: pointer; flex-shrink: 0;
}
#fmt-bold { font-family: Georgia, serif; }
#fmt-hl, #fmt-align, #fmt-lh { font-size: 0.85rem; }
#fmt-bold.active, #fmt-hl.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.fmt-lh-wrap { position: relative; display: flex; }
.fmt-lh-pop {
  display: none; position: absolute;
  bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  flex-direction: column; z-index: 20; min-width: 110px;
}
.fmt-lh-pop.open { display: flex; }
.fmt-lh-opt {
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  font-size: 0.82rem; color: var(--text); white-space: nowrap;
}
.fmt-lh-opt:hover { background: var(--surface2); }
.fmt-lh-opt.active { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.fmt-c-wrap { position: relative; display: flex; align-items: center; }
#fmt-c-btn {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid var(--border); flex-shrink: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  transition: transform .15s;
}
#fmt-c-btn:hover { transform: scale(1.15); }
.fmt-c-pop {
  display: none; position: absolute;
  bottom: calc(100% + 10px); right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  flex-direction: column; gap: 6px; z-index: 20;
}
.fmt-c-pop.open { display: flex; }
.fmt-pop-label {
  font-size: 0.62rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-muted);
}
.fmt-pop-row { display: flex; gap: 8px; align-items: center; }
.fmt-hlc {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; flex-shrink: 0;
  transition: transform .12s, border-color .12s;
}
.fmt-hlc:hover { transform: scale(1.18); }
.fmt-hlc.active { border-color: var(--text); transform: scale(1.12); }
.fmt-hlc-none {
  background: var(--surface2); border-color: var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 0.72rem;
}
.fmt-c {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35);
  transition: transform .12s, border-color .12s; flex-shrink: 0;
}
.fmt-c:hover { transform: scale(1.18); }
.fmt-c.active { border-color: var(--text); transform: scale(1.12); }

/* modo planejamento: só módulos padrão (sem criação livre nem resize) */
#event-detail.modo-plano #tool-postit,
#event-detail.modo-plano #tool-text,
#event-detail.modo-plano #tool-video,
#event-detail.modo-plano #tool-photo,
#event-detail.modo-plano #tool-template,
#event-detail.modo-plano .ed-tool-sep { display: none; }
#event-detail.modo-plano .cn-h { display: none !important; }
.plan-week-nav, .plan-reset, .plan-copy { display: none; }
#event-detail.modo-plano .plan-copy { display: flex; }
#event-detail.modo-plano .plan-week-nav {
  display: flex; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
}
#event-detail.modo-plano .plan-reset { display: flex; }
#event-detail.modo-plano .plan-reset:hover { background: var(--surface2); color: var(--red); }
#event-detail.modo-plano .ed-topbar-badge { display: none; }

/* bottom toolbar */
#ed-toolbar {
  flex-shrink: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px;
}
.ed-tool {
  width: 42px; height: 42px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--surface2);
  color: var(--text-muted); font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit; transition: all .15s; flex-shrink: 0;
}
.ed-tool.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.ed-tool:hover:not(.active) { border-color: var(--text-muted); color: var(--text); }
.ed-tool-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
.ed-pc-wrap { position: relative; display: none; align-items: center; }
.ed-pc {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent; transition: transform .15s, border-color .15s;
  flex-shrink: 0;
}
.ed-pc:hover { transform: scale(1.2); }
.ed-pc-current { border-color: var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.ed-pc-pop {
  display: none; position: absolute;
  bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  gap: 8px; align-items: center; z-index: 20;
}
.ed-pc-pop.open { display: flex; }
.ed-toolbar-spacer { flex: 1; }
.ed-canvas-save {
  font-size: 0.72rem; color: var(--text-muted); opacity: 0;
  transition: opacity .4s; white-space: nowrap;
}
.ed-canvas-save.show { opacity: 1; }

/* SELETOR DE COR */
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-opt {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.color-opt:hover { transform: scale(1.15); }
.color-opt.selected { border-color: #fff; transform: scale(1.15); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-overlay.center { align-items: center; padding: 0 16px; }
.modal-overlay.center .modal { border-radius: 20px; max-width: 440px; padding-bottom: 22px; }
.modal {
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 26px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px;
}
.modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }
.form-group { margin-bottom: 13px; }
.form-label { display: block; font-size: 0.73rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
.form-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 13px; color: var(--text);
  font-size: 1rem; font-family: 'DM Sans', sans-serif; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.form-input:focus { border-color: var(--accent); }
textarea.form-input { resize: none; height: 76px; }
.btn-row { display: flex; gap: 10px; margin-top: 18px; }
.btn {
  flex: 1; padding: 13px; border-radius: 12px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
.btn:active { opacity: 0.75; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-ghost { background: var(--surface2); color: var(--text-muted); }

/* MODAL PLANEJADO DO DIA — cada post agrupado num card */
#plano-list {
  background-color: #f0ede8;
  background-image: radial-gradient(circle, #ccc8c0 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 12px; margin-bottom: 4px;
  display: flex; flex-direction: column; gap: 12px;
  color: #1a1814;
}
.plano-count {
  font-size: .66rem; font-weight: 700; background: #eeedfe; color: #3c3489;
  padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
}
.plano-post {
  background: #fff; border-radius: 14px; padding: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  font-family: 'DM Sans', sans-serif;
}
.plano-post-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.plano-post-num {
  font-size: .64rem; font-weight: 700; letter-spacing: .08em; color: var(--accent);
}
.plano-post-tipo {
  display: flex; align-items: center; gap: 4px;
  font-size: .64rem; font-weight: 700; letter-spacing: .05em;
  color: var(--text-muted); text-transform: uppercase;
}
.plano-post-row { display: flex; gap: 12px; align-items: flex-start; }
.plano-post-img {
  width: 130px; max-width: 40%; border-radius: 10px; display: block;
  background: #e8e3db; flex-shrink: 0;
}
.plano-post-texto {
  flex: 1; min-width: 0; font-size: .84rem; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; padding-top: 2px;
}
.plano-mod-postit {
  border-radius: 4px; padding: 9px 11px; width: fit-content; max-width: 100%;
  box-shadow: 2px 4px 12px rgba(0,0,0,.15); font-size: .84rem; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
.plano-post .camp-video-label { display: none; }
.plano-post .pq-row { background: #f4f1ec; box-shadow: none; }
.plano-post .ck-row, .plano-post .pq-row { margin-bottom: 5px; }
.plano-post-ck { border-top: 1px solid #ede9e2; margin-top: 12px; padding-top: 10px; }
.plano-post-ck:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.plano-post-ck-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.plano-post-ck-prog { font-size: .66rem; font-weight: 700; color: var(--green); }

/* TOAST */
#toast {
  position: fixed; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #2a2836; color: #fff; padding: 9px 18px;
  border-radius: 20px; font-size: 0.83rem; opacity: 0;
  transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: none; color: var(--text-muted);
  font-family: 'DM Sans', sans-serif; font-size: 0.62rem; font-weight: 500;
  cursor: pointer; padding: 4px 0; transition: color 0.15s;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 1.25rem; line-height: 1; }

/* ── RESPONSIVO: NOTEBOOK (768px+) ── */
@media (min-width: 768px) {
  .period-nav  { max-width: 900px; padding: 18px 28px 14px; }
  .cal-wrap    { max-width: 900px; padding: 0 20px; }
  #view-anual  { max-width: 900px; padding: 0 20px; }
  .events-wrap { max-width: 900px; padding: 0 24px; }

  .cal-day { min-height: 82px; padding: 7px 5px 4px; }
  .ev-pill { font-size: 0.63rem; padding: 2px 5px; }
  .day-num { font-size: 0.8rem; width: 22px; height: 22px; }
  .cal-day.today .day-num { width: 22px; height: 22px; }

  .year-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .mini-month-title { font-size: 0.75rem; }
  .mini-day { font-size: 0.55rem; padding: 3px 0; }
  .mini-dow { font-size: 0.48rem; padding: 3px 0; }
}

/* ── RESPONSIVO: DESKTOP GRANDE (1280px+) ── */
@media (min-width: 1280px) {
  .period-nav  { max-width: 1600px; padding: 22px 48px 16px; }
  .cal-wrap    { max-width: 1600px; padding: 0 40px; }
  #view-anual  { max-width: 1600px; padding: 0 40px; }
  .events-wrap { max-width: 1600px; padding: 0 44px; }

  .period-label { font-size: 1.2rem; }
  .nav-arrow    { width: 36px; height: 36px; font-size: 1.1rem; }

  .cal-day { min-height: 110px; padding: 9px 7px 5px; gap: 3px; }
  .ev-pill { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; }
  .day-num { font-size: 0.9rem; width: 26px; height: 26px; }
  .cal-day.today .day-num { width: 26px; height: 26px; }

  .year-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .mini-month { padding: 14px 12px; }
  .mini-month-title { font-size: 0.82rem; margin-bottom: 8px; }
  .mini-day { font-size: 0.62rem; padding: 4px 0; }
  .mini-dow { font-size: 0.52rem; padding: 4px 0; }

  .event-card     { padding: 16px 18px; }
  .event-title    { font-size: 0.95rem; }
  .event-desc     { font-size: 0.8rem; }
  .event-date-day { font-size: 1.3rem; }
  .section-title  { font-size: 0.72rem; }
}

/* Campanhas */
.campanha-card{background:#fff;border-radius:14px;padding:16px;position:relative;overflow:hidden;margin-bottom:10px;}
.campanha-card::before{content:'';position:absolute;inset:0;opacity:.07;pointer-events:none;border-radius:14px;}
.campanha-card.canal-instagram::before{background:radial-gradient(circle at 80% 10%,#fd1d1d,#833ab4 60%);}
.campanha-card.canal-whatsapp::before{background:radial-gradient(circle at 80% 10%,#25D366,#128C7E 60%);}
.campanha-card.canal-ambos::before{background:radial-gradient(circle at 80% 10%,#5b4fcf,#a090e0 60%);}
.camp-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.camp-canal-tag{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.camp-canal-tag.canal-instagram{color:#f77737;}
.camp-canal-tag.canal-whatsapp{color:#25D366;}
.camp-canal-tag.canal-ambos{color:#5b4fcf;}
.camp-status-indicator{display:flex;align-items:center;gap:5px;font-size:.7rem;color:#9a9490;}
.camp-status-indicator::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.camp-status-indicator.status-rascunho::before{background:#555;}
.camp-status-indicator.status-aprovada::before{background:#5b4fcf;}
.camp-status-indicator.status-publicada::before{background:#52b88a;}
.camp-label-titulo{font-size:.78rem;color:#9a9490;font-weight:500;margin-bottom:6px;}
.camp-ideia-text{font-family:Georgia,serif;font-size:1rem;color:#1a1814;line-height:1.55;margin-bottom:14px;font-style:italic;}
.camp-video-label{font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9a9490;margin-bottom:6px;}
.camp-video-thumb{border-radius:10px;overflow:hidden;margin-bottom:0;position:relative;background:#e0dbd3;width:72px;height:72px;flex-shrink:0;cursor:pointer;}
.camp-video-thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.85);}
.camp-video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);}
.camp-video-overlay:hover{background:rgba(0,0,0,.4);}
.camp-play-btn{width:44px;height:44px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.4);}
.camp-play-btn svg{width:18px;height:18px;fill:#1a1814;margin-left:2px;}
.camp-video-source-tag{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:rgba(255,255,255,.8);font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;}
.camp-video-tiktok{display:flex;align-items:center;gap:12px;background:#f0ede8;border:1px solid #dbd5cc;border-radius:10px;padding:12px 14px;margin-bottom:14px;text-decoration:none;}
.camp-video-tiktok-icon{width:36px;height:36px;border-radius:8px;background:#1a1814;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.camp-video-tiktok-text .vtt-label{font-size:.68rem;color:#9a9490;margin-bottom:2px;}
.camp-video-tiktok-text .vtt-url{font-size:.75rem;color:#1a1814;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.camp-acoes-section{border-top:1px solid #e0dbd3;padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.camp-acoes-loja-title{display:flex;align-items:center;gap:5px;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a9490;margin-bottom:6px;}
.camp-acoes-loja-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.camp-acoes-loja-dot.areal{background:#7b8cde;}
.camp-acoes-loja-dot.trios{background:#de7bb8;}
.camp-acao-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #e8e3db;cursor:pointer;}
.camp-acao-item:last-child{border-bottom:none;}
.camp-acao-check{width:15px;height:15px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;font-weight:700;}
.camp-acao-check.done{background:#52b88a;border-color:#52b88a;color:white;}
.camp-acao-text{font-size:.78rem;color:#1a1814;}
.camp-acao-text.done{text-decoration:line-through;color:#b0aba5;}
.camp-add-acao{display:flex;align-items:center;gap:5px;font-size:.72rem;color:#b0aba5;background:none;border:none;cursor:pointer;padding:4px 0;width:100%;text-align:left;font-family:inherit;}
.camp-add-acao:hover{color:#5b4fcf;}
.camp-add-acao-icon{width:15px;height:15px;border-radius:4px;border:1.5px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#b0aba5;flex-shrink:0;}
.camp-acao-input-row{display:flex;gap:5px;margin-top:4px;}
.camp-acao-input{background:#f0ede8;border:1px solid #ccc;border-radius:6px;padding:4px 8px;font-size:.78rem;color:#1a1814;flex:1;outline:none;font-family:inherit;}
.camp-acao-input:focus{border-color:#5b4fcf;}
.camp-acao-save-btn{background:#5b4fcf;border:none;border-radius:6px;color:#fff;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:inherit;}
.camp-del{position:absolute;top:10px;right:10px;background:none;border:none;color:#ccc;cursor:pointer;font-size:1rem;}
.camp-del:hover{color:#e05252;}
.camp-section-title{font-size:.72rem;font-weight:700;color:#9a9490;text-transform:uppercase;letter-spacing:.06em;padding:10px 0 4px;display:flex;align-items:center;gap:5px;}
.campanha-dot{display:inline-block;width:5px;height:5px;background:#a78bfa;border-radius:50%;vertical-align:middle;margin-left:2px;}
.btn-campanha{background:none;border:1px solid #a78bfa33;border-radius:6px;cursor:pointer;color:#a78bfa;padding:3px 8px;font-size:.75rem;display:flex;align-items:center;gap:4px;margin-top:6px;width:fit-content;}
.btn-campanha:hover{background:color-mix(in srgb,#a78bfa 15%,transparent);}
.camp-edit-btn{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:#9a9490;background:none;border:1px solid #dbd5cc;border-radius:6px;padding:4px 9px;cursor:pointer;margin-top:12px;font-family:inherit;}
.camp-edit-btn:hover{color:#5b4fcf;border-color:#5b4fcf;}

/* Modal campanha redesign */
.camp-canal-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.camp-canal-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1.5px solid #dbd5cc;background:#f4f2ee;color:#9a9490;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.camp-canal-pill:hover{border-color:#9a9490;color:#3a3836;}
.camp-canal-pill.active[data-canal="Instagram"]{border-color:#f77737;color:#f77737;background:color-mix(in srgb,#f77737 10%,transparent);}
.camp-canal-pill.active[data-canal="WhatsApp"]{border-color:#25D366;color:#25D366;background:color-mix(in srgb,#25D366 10%,transparent);}
.camp-canal-pill.active[data-canal="TikTok"]{border-color:#69C9D0;color:#69C9D0;background:color-mix(in srgb,#69C9D0 10%,transparent);}
.campanha-card.canal-tiktok::before{background:radial-gradient(circle at 80% 10%,#EE1D52,#69C9D0 60%);}
.camp-canal-tag.canal-tiktok{color:#69C9D0;}
.camp-canal-pill.active[data-canal="Ambos"]{border-color:#5b4fcf;color:#5b4fcf;background:color-mix(in srgb,#5b4fcf 10%,transparent);}
.camp-ideia-wrap{position:relative;}
.camp-ideia-textarea{width:100%;background:#f0ede8;border:1.5px solid #dbd5cc;border-radius:12px;padding:14px 16px;font-family:Georgia,serif;font-size:.95rem;font-style:italic;color:#1a1814;line-height:1.6;min-height:130px;resize:vertical;outline:none;box-sizing:border-box;transition:border-color .15s;}
.camp-ideia-textarea:focus{border-color:#5b4fcf;}
.camp-ideia-textarea::placeholder{color:#b0aba5;font-style:italic;}
.camp-ideia-counter{text-align:right;font-size:.65rem;color:#b0aba5;margin-top:4px;}
.camp-video-input-wrap{display:flex;align-items:center;background:#f0ede8;border:1.5px solid #dbd5cc;border-radius:10px;overflow:hidden;transition:border-color .15s;}
.camp-video-input-wrap:focus-within{border-color:#5b4fcf;}
.camp-video-ico{padding:0 10px;font-size:1rem;flex-shrink:0;}
.camp-video-input{flex:1;background:transparent;border:none;padding:10px 4px 10px 0;font-size:.82rem;color:#1a1814;outline:none;font-family:inherit;}
.camp-video-input::placeholder{color:#b0aba5;}
.camp-status-pills{display:flex;gap:8px;margin-top:4px;}
.camp-status-pill{padding:6px 16px;border-radius:20px;border:1.5px solid #dbd5cc;background:#f4f2ee;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;color:#9a9490;}
.camp-status-pill:hover{border-color:#9a9490;color:#3a3836;}
.camp-status-pill.active.pill-rascunho{border-color:#9a9490;color:#3a3836;background:color-mix(in srgb,#9a9490 15%,transparent);}
.camp-status-pill.active.pill-aprovada{border-color:#5b4fcf;color:#5b4fcf;background:color-mix(in srgb,#5b4fcf 12%,transparent);}
.camp-status-pill.active.pill-publicada{border-color:#52b88a;color:#52b88a;background:color-mix(in srgb,#52b88a 12%,transparent);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-logo">Shai</div>
    <div class="header-sub" id="header-sub">Calendário da Loja</div>
  </div>
  <button class="add-btn" onclick="openModal('modal-add')" title="Novo evento">
    <i class="ti ti-plus"></i>
  </button>
</div>

<div class="app-body">
<!-- PERIOD NAV -->
<div class="period-nav" id="period-nav">
  <div class="period-label" id="period-label"></div>
  <div class="period-controls">
    <div class="view-toggle">
      <button id="vt-mensal" class="active" onclick="setView('mensal')">Mês</button>
      <button id="vt-anual" onclick="setView('anual')">Ano</button>
    </div>
    <button class="nav-arrow" onclick="changePeriod(-1)"><i class="ti ti-chevron-left"></i></button>
    <button class="nav-arrow" onclick="changePeriod(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
</div>

<!-- VIEW: MENSAL -->
<div id="view-mensal">
  <div class="cal-wrap">
    <div class="cal-grid" id="cal-grid">
      <div class="cal-dow">Dom</div><div class="cal-dow">Seg</div><div class="cal-dow">Ter</div>
      <div class="cal-dow">Qua</div><div class="cal-dow">Qui</div><div class="cal-dow">Sex</div><div class="cal-dow">Sáb</div>
    </div>
  </div>
  <div class="events-wrap">
    <div class="section-title" id="events-title"><i class="ti ti-calendar-event"></i> Eventos do mês</div>
    <div id="events-list"></div>
  </div>
</div>

<!-- VIEW: ANUAL -->
<div id="view-anual">
  <div class="year-grid" id="year-grid"></div>
  <div class="events-wrap">
    <div class="section-title" id="year-events-title"><i class="ti ti-calendar-event"></i> Todos os eventos</div>
    <div id="year-events-list"></div>
  </div>
</div>

<!-- VIEW: CAMPANHAS -->
<div id="view-campanhas" style="display:none">
  <div class="events-wrap">
    <div id="campanhas-list"></div>
  </div>
</div>

</div><!-- /app-body -->

<!-- TELA: DETALHE DO EVENTO -->
<div id="event-detail">
  <!-- topbar -->
  <div class="ed-topbar" id="ed-topbar">
    <button class="ed-back" onclick="closeEventDetail()"><i class="ti ti-arrow-left"></i></button>
    <div class="ed-topbar-info">
      <div class="ed-topbar-title" id="ed-titulo"></div>
      <div class="ed-topbar-sub" id="ed-sub"></div>
    </div>
    <button class="ed-topbar-action plan-week-nav" onclick="mudarSemana(-1)" title="Semana anterior"><i class="ti ti-chevron-left"></i></button>
    <button class="ed-topbar-action plan-week-nav" onclick="mudarSemana(1)" title="Próxima semana"><i class="ti ti-chevron-right"></i></button>
    <button class="ed-topbar-action plan-copy" onclick="copiarSemanaAnterior()" title="Copiar estrutura da semana anterior"><i class="ti ti-copy"></i></button>
    <button class="ed-topbar-action plan-reset" onclick="zerarSemana()" title="Zerar planejamento da semana"><i class="ti ti-eraser"></i></button>
    <div class="ed-topbar-badge" id="ed-badge"></div>
    <button class="ed-topbar-action" onclick="abrirEdCampanha()" title="Campanhas"><i class="ti ti-speakerphone"></i></button>
    <button class="ed-topbar-action" onclick="abrirEdAcoes()" title="Ações por loja"><i class="ti ti-checklist"></i></button>
    <button class="ed-save-btn" onclick="salvarESair()"><i class="ti ti-check"></i> Salvar</button>
  </div>

  <!-- canvas -->
  <div id="ed-canvas"><div id="ed-world"></div></div>

  <!-- barra de formatação (aparece ao selecionar elemento) -->
  <div id="ed-fmtbar">
    <div class="fmt-font-wrap" id="fmt-font-wrap">
      <button id="fmt-font-btn" onclick="toggleFontPop(event)" title="Fonte">
        <span id="fmt-font-label" style="font-family:'DM Sans',sans-serif">DM Sans</span>
        <i class="ti ti-chevron-up"></i>
      </button>
      <div class="fmt-font-pop" id="fmt-font-pop">
        <div class="fmt-font-opt" data-font="'DM Sans',sans-serif" style="font-family:'DM Sans',sans-serif" onclick="selectFont(this)">DM Sans</div>
        <div class="fmt-font-opt" data-font="'Playfair Display',serif" style="font-family:'Playfair Display',serif" onclick="selectFont(this)">Playfair Display</div>
        <div class="fmt-font-opt" data-font="Georgia,serif" style="font-family:Georgia,serif" onclick="selectFont(this)">Georgia</div>
        <div class="fmt-font-opt" data-font="Arial,sans-serif" style="font-family:Arial,sans-serif" onclick="selectFont(this)">Arial</div>
        <div class="fmt-font-opt" data-font="'Courier New',monospace" style="font-family:'Courier New',monospace" onclick="selectFont(this)">Courier New</div>
      </div>
    </div>
    <select id="fmt-size" onchange="fmtApply()" title="Tamanho">
      <option>10</option><option>12</option><option>14</option><option selected>16</option>
      <option>18</option><option>20</option><option>24</option><option>28</option>
      <option>32</option><option>40</option><option>48</option><option>64</option>
    </select>
    <button id="fmt-bold" onclick="fmtBoldToggle()" title="Negrito">B</button>
    <button id="fmt-align" onclick="fmtAlignToggle()" title="Alinhamento"><i class="ti ti-align-left" id="fmt-align-icon"></i></button>
    <div class="fmt-lh-wrap" id="fmt-lh-wrap">
      <button id="fmt-lh" onclick="toggleLhPop(event)" title="Espaçamento entre linhas"><i class="ti ti-line-height"></i></button>
      <div class="fmt-lh-pop" id="fmt-lh-pop">
        <div class="fmt-lh-opt" data-lh="1.15" onclick="selectLh(this)">Junto</div>
        <div class="fmt-lh-opt active" data-lh="1.5" onclick="selectLh(this)">Normal</div>
        <div class="fmt-lh-opt" data-lh="2" onclick="selectLh(this)">Afastado</div>
      </div>
    </div>
    <button id="fmt-hl" onclick="toggleColorPop(event)" title="Marca-texto"><i class="ti ti-highlight"></i></button>
    <div class="fmt-c-wrap" id="fmt-c-wrap">
      <div id="fmt-c-btn" onclick="toggleColorPop(event)" title="Cores" style="background:#1a1814"></div>
      <div class="fmt-c-pop" id="fmt-c-pop">
        <div class="fmt-pop-label">Cor do texto</div>
        <div class="fmt-pop-row">
          <div class="fmt-c active" data-c="#1a1814" onclick="fmtColor(this)" style="background:#1a1814"></div>
          <div class="fmt-c" data-c="#9a9490" onclick="fmtColor(this)" style="background:#9a9490"></div>
          <div class="fmt-c" data-c="#c44848" onclick="fmtColor(this)" style="background:#c44848"></div>
          <div class="fmt-c" data-c="#d97b2a" onclick="fmtColor(this)" style="background:#d97b2a"></div>
          <div class="fmt-c" data-c="#3a9a6a" onclick="fmtColor(this)" style="background:#3a9a6a"></div>
          <div class="fmt-c" data-c="#2a6fc4" onclick="fmtColor(this)" style="background:#2a6fc4"></div>
          <div class="fmt-c" data-c="#5b4fcf" onclick="fmtColor(this)" style="background:#5b4fcf"></div>
          <div class="fmt-c" data-c="#d4589a" onclick="fmtColor(this)" style="background:#d4589a"></div>
        </div>
        <div class="fmt-pop-label">Marca-texto</div>
        <div class="fmt-pop-row">
          <div class="fmt-hlc fmt-hlc-none" data-hlc="" onclick="selectHl(this)" title="Sem destaque"><i class="ti ti-ban"></i></div>
          <div class="fmt-hlc" data-hlc="255,210,50"  onclick="selectHl(this)" style="background:rgb(255,210,50)"></div>
          <div class="fmt-hlc" data-hlc="110,225,120" onclick="selectHl(this)" style="background:rgb(110,225,120)"></div>
          <div class="fmt-hlc" data-hlc="255,120,180" onclick="selectHl(this)" style="background:rgb(255,120,180)"></div>
          <div class="fmt-hlc" data-hlc="110,190,255" onclick="selectHl(this)" style="background:rgb(110,190,255)"></div>
          <div class="fmt-hlc" data-hlc="255,160,70"  onclick="selectHl(this)" style="background:rgb(255,160,70)"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- toolbar -->
  <div id="ed-toolbar">
    <button class="ed-tool active" id="tool-cursor" onclick="selectTool('cursor')" title="Selecionar">
      <i class="ti ti-pointer"></i>
    </button>
    <button class="ed-tool" id="tool-postit" onclick="selectTool('postit')" title="Post-it">
      <i class="ti ti-note"></i>
    </button>
    <button class="ed-tool" id="tool-text" onclick="selectTool('text')" title="Caixa de texto">
      <i class="ti ti-letter-t"></i>
    </button>
    <button class="ed-tool" id="tool-video" onclick="selectTool('video')" title="Vídeo / Ideia">
      <i class="ti ti-video"></i>
    </button>
    <button class="ed-tool" id="tool-photo" onclick="selectTool('photo')" title="Foto">
      <i class="ti ti-photo"></i>
    </button>
    <input type="file" id="cn-photo-file" accept="image/*" style="display:none" onchange="_photoPicked(this)">
    <div class="ed-tool-sep"></div>
    <button class="ed-tool" id="tool-template" onclick="inserirTemplateSemanal()" title="Modelo: planejamento semanal">
      <i class="ti ti-layout-board-split"></i>
    </button>
    <div class="ed-pc-wrap" id="ed-pc-wrap">
      <div class="ed-pc ed-pc-current" id="ed-pc-current" onclick="togglePostitPop(event)" style="background:#fef3a7" title="Cor do post-it"></div>
      <div class="ed-pc-pop" id="ed-pc-pop">
        <div class="ed-pc" data-color="#fef3a7" onclick="selectPostitColor(this)" style="background:#fef3a7"></div>
        <div class="ed-pc" data-color="#ffd6e0" onclick="selectPostitColor(this)" style="background:#ffd6e0"></div>
        <div class="ed-pc" data-color="#d6e8ff" onclick="selectPostitColor(this)" style="background:#d6e8ff"></div>
        <div class="ed-pc" data-color="#d6f5e3" onclick="selectPostitColor(this)" style="background:#d6f5e3"></div>
        <div class="ed-pc" data-color="#e8d6ff" onclick="selectPostitColor(this)" style="background:#e8d6ff"></div>
      </div>
    </div>
    <div class="ed-toolbar-spacer"></div>
    <span class="ed-canvas-save" id="ed-canvas-save">• salvo</span>
  </div>
</div>

<!-- MODAL: NOVO EVENTO -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-title">Novo Evento</div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input type="date" class="form-input" id="ev-data">
    </div>
    <div class="form-group">
      <label class="form-label">Título</label>
      <input type="text" class="form-input" id="ev-titulo" placeholder="Ex: Liquidação de inverno">
    </div>
    <div class="form-group">
      <label class="form-label">Descrição (opcional)</label>
      <textarea class="form-input" id="ev-desc" placeholder="Detalhes do evento..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Cor do evento</label>
      <div class="color-picker" id="color-picker"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-add')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEvento()">Salvar</button>
    </div>
  </div>
</div>

function getComemorativas(ano) {
  const r = FIXAS.map(c => ({
    data: `${ano}-${pad(c.mes)}-${pad(c.dia)}`,
    titulo: c.titulo, desc: c.desc, cor: c.cor, tipo: 'comemorativa'
  }));
  // variáveis
  r.push({ data: nthWeekday(ano,5,0,2), titulo:'Dia das Mães',  desc:'Top 1 data do ano para moda feminina — prepare 3 semanas antes', cor:'#cf8080', tipo:'comemorativa' });
  r.push({ data: nthWeekday(ano,8,0,2), titulo:'Dia dos Pais',  desc:'Moda masculina e acessórios — boa data para presentes', cor:'#cf8080', tipo:'comemorativa' });
  const bf = lastWeekday(ano,11,5);
  r.push({ data: bf, titulo:'Black Friday', desc:'Queima de estoque com descontos — prepare divulgação com 1 semana de antecedência', cor:'#cf8080', tipo:'comemorativa' });
  const cm = new Date(bf); cm.setDate(cm.getDate()+3);
  r.push({ data: iso(cm), titulo:'Cyber Monday', desc:'Sequência da Black Friday — promoções online', cor:'#c4a85a', tipo:'comemorativa' });
  r.push({ data: pascoa(ano), titulo:'Páscoa', desc:'Feriado — família e presenteamento', cor:'#7d858c', tipo:'comemorativa' });
  const c2 = new Date(pascoa(ano)); c2.setDate(c2.getDate()-47);
  r.push({ data: iso(c2), titulo:'Carnaval', desc:'Feriado prolongado — queda de movimento em loja física', cor:'#7d858c', tipo:'comemorativa' });
  return r;
}

function nthWeekday(ano, mes, dow, n) {
  let d = new Date(ano, mes-1, 1), count = 0;
  while (count < n) { if (d.getDay()===dow) count++; if (count<n) d.setDate(d.getDate()+1); }
  return iso(d);
}
function lastWeekday(ano, mes, dow) {
  let d = new Date(ano, mes, 0);
  while (d.getDay()!==dow) d.setDate(d.getDate()-1);
  return iso(d);
}
function pascoa(ano) {
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
  return iso(new Date(ano, mes-1, dia));
}
// data local (não UTC) — toISOString vira o dia seguinte depois das 21h no Brasil
function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function pad(n) { return String(n).padStart(2,'0'); }

function allEventos(ano) {
  // registros espelho (mesma data+título de uma comemorativa) guardam o canvas
  // da comemorativa — funde no evento gerado e tira da lista de eventos da loja
  const com = getComemorativas(ano);
  const loja = [];
  const shadows = {};
  eventosLoja.forEach(e => {
    if (e.titulo === 'Planejamento semanal') return; // quadros não são eventos do calendário
    const m = com.find(c => c.data === e.data && c.titulo === e.titulo);
    if (m) shadows[e.data + '|' + e.titulo] = e;
    else loja.push(e);
  });
  const comMerged = com.map(c => {
    const s = shadows[c.data + '|' + c.titulo];
    return s ? { ...c, id: s.id, canvas: s.canvas } : c;
  });
  return [...comMerged, ...loja];
}

// ===== SUPABASE =====
async function loadEventosLoja() {
  const [evRes, campRes] = await Promise.all([
    sb.from('eventos_loja').select('*').order('data'),
    sb.from('campanhas').select('*').order('data_campanha')
  ]);
  eventosLoja = (evRes.data || []).map(e => ({ ...e, tipo:'loja' }));
  campanhas = campRes.data || [];
  renderView();
  _restoreOpenEvent();
}

// reabre o evento indicado na URL (#ev=...) após o reload
let _restoredOnce = false;
function _restoreOpenEvent() {
  if (_restoredOnce) return;
  _restoredOnce = true;
  const m = location.hash.match(/^#ev=(.+)$/);
  if (!m) return;
  const ref = m[1];
  let ev;
  if (ref.startsWith('c:')) {
    const [, data, titulo] = ref.split(':');
    ev = allEventos(viewYear).find(e => e.data === data && e.titulo === decodeURIComponent(titulo));
  } else {
    ev = allEventos(viewYear).find(e => e.id === ref) || eventosLoja.find(e => e.id === ref);
  }
  if (!ev) { _setHash(''); return; }
  const idx = _evCache.push(ev) - 1;
  openEventDetail(idx);
}

async function salvarEvento() {
  const data   = document.getElementById('ev-data').value;
  const titulo = document.getElementById('ev-titulo').value.trim();
  const desc   = document.getElementById('ev-desc').value.trim();
  const cor    = corSelecionada;
  if (!data || !titulo) { showToast('Preencha a data e o título','error'); return; }
  const { error } = await sb.from('eventos_loja').insert({ data, titulo, descricao: desc||null, cor });
  if (error) {
    if (error.code === '42P01' || error.message?.includes('does not exist')) {
      eventosLoja.push({ id: Date.now().toString(), data, titulo, descricao:desc||null, cor, tipo:'loja' });
      closeModal('modal-add'); limparModal(); renderView();
      showToast('Salvo localmente — rode o SQL no Supabase para persistir');
      return;
    }
    if (error.code === '42703' || error.message?.includes('column')) {
      // tabela existe mas sem coluna cor — salva sem a cor
      const { error: e2 } = await sb.from('eventos_loja').insert({ data, titulo, descricao: desc||null });
      if (!e2) { closeModal('modal-add'); limparModal(); await loadEventosLoja(); showToast('Evento salvo! (rode o SQL para adicionar coluna cor)'); return; }
    }
    showToast('Erro: ' + (error.message || error.code), 'error'); return;
  }
  closeModal('modal-add'); limparModal();
  await loadEventosLoja();
  showToast('Evento salvo!');
}

// ===== MENSAL =====
function renderMensal() {
  document.getElementById('period-label').textContent = `${MESES[viewMonth]} ${viewYear}`;
  document.getElementById('header-sub').textContent = 'Calendário — Mês';

  const eventos = allEventos(viewYear);
  const prefix  = `${viewYear}-${pad(viewMonth+1)}`;
  const doMes   = eventos.filter(e => e.data.startsWith(prefix));

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const days     = new Date(viewYear, viewMonth+1, 0).getDate();
  const isThisMonth = viewYear===todayY && viewMonth===todayM-1;

  const grid = document.getElementById('cal-grid');
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const planoMap = _planejadoMap();

  for (let i=0; i<firstDay; i++) {
    const el = document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el);
  }
  for (let d=1; d<=days; d++) {
    const dataStr = `${viewYear}-${pad(viewMonth+1)}-${pad(d)}`;
    const evs = doMes.filter(e => e.data===dataStr)
                     .sort((a,b) => (a.tipo==='loja'?0:1)-(b.tipo==='loja'?0:1));
    const isToday = isThisMonth && d===todayD;
    const el = document.createElement('div');
    el.className = 'cal-day' + (isToday?' today':'');
    el.onclick = () => showDayEvents(dataStr, d);
    const primCor = evs.length ? (evs[0].cor || (evs[0].tipo==='loja' ? 'var(--accent)' : 'var(--yellow)')) : null;
    const numStyle = primCor && !isToday ? `style="background:color-mix(in srgb,${primCor} 30%,transparent);color:${primCor};font-weight:700"` : '';
    let html = `<span class="day-num" ${numStyle}>${d}</span>`;
    evs.slice(0,2).forEach(e => {
      const lbl = e.titulo.length>10 ? e.titulo.slice(0,9)+'…' : e.titulo;
      const c = e.cor || (e.tipo==='loja' ? 'var(--accent)' : 'var(--yellow)');
      html += `<div class="ev-pill" style="background:color-mix(in srgb,${c} 25%,transparent);color:${c}">${lbl}</div>`;
    });
    if (evs.length>2) html += `<div class="ev-pill more">+${evs.length-2}</div>`;
    const planos = planoMap[dataStr];
    if (planos && planos.length) html += `<div class="ev-pill plano"><i class="ti ti-player-play"></i> ${planos.length} post${planos.length>1?'s':''}</div>`;
    const hasCamp = campanhas.some(c => c.data_campanha===dataStr);
    if (hasCamp) html += `<span class="campanha-dot" title="Tem campanha"></span>`;
    el.innerHTML = html;
    if (evs.length) {
      el.addEventListener('mouseenter', ev => showTooltip(ev, evs));
      el.addEventListener('mouseleave', hideTooltip);
    }
    grid.appendChild(el);
  }

  // lista abaixo
  document.getElementById('events-title').innerHTML = '<i class="ti ti-calendar-event"></i> Eventos do mês';
  renderEventCards('events-list', doMes.sort((a,b)=>a.data.localeCompare(b.data)));
}

function showDayEvents(dataStr, dia) {
  diaAberto = dataStr;
  const eventos = allEventos(viewYear).filter(e => e.data===dataStr);
  const campsDay = campanhas.filter(c => c.data_campanha===dataStr);
  const planos = _planejadoMap()[dataStr] || [];
  if (planos.length) abrirPlanoDia(dataStr, planos);
  if (!eventos.length && !campsDay.length) {
    if (!planos.length) {
      document.getElementById('ev-data').value = dataStr;
      openModal('modal-add');
    }
    return;
  }
  const [,m] = dataStr.split('-');
  document.getElementById('events-title').innerHTML =
    `<i class="ti ti-calendar-event"></i> ${dia}/${parseInt(m)} — ${eventos.length} evento(s)`;
  renderEventCards('events-list', eventos);
  if (campsDay.length) renderCampanhaCards('events-list', campsDay, true);
  document.getElementById('events-list').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ===== ANUAL =====
function renderAnual() {
  document.getElementById('period-label').textContent = String(viewYear);
  document.getElementById('header-sub').textContent = 'Calendário — Ano';

  const eventos = allEventos(viewYear);
  const grid = document.getElementById('year-grid');
  grid.innerHTML = '';

  for (let m=0; m<12; m++) {
    const prefix = `${viewYear}-${pad(m+1)}`;
    const doMes  = eventos.filter(e => e.data.startsWith(prefix));
    const isThisMes = viewYear===todayY && m===todayM-1;
    const firstDay  = new Date(viewYear, m, 1).getDay();
    const days      = new Date(viewYear, m+1, 0).getDate();

    const box = document.createElement('div');
    box.className = 'mini-month';

    let miniHTML = `<div class="mini-month-title">${MESES[m]}</div><div class="mini-grid">`;
    DOWS.forEach(d => miniHTML += `<div class="mini-dow">${d[0]}</div>`);
    for (let i=0; i<firstDay; i++) miniHTML += '<div class="mini-day"></div>';
    for (let d=1; d<=days; d++) {
      const dataStr = `${viewYear}-${pad(m+1)}-${pad(d)}`;
      const evs = doMes.filter(e => e.data===dataStr);
      const isToday = isThisMes && d===todayD;
      let cls = 'mini-day';
      let inlineStyle = '';
      if (isToday) {
        cls += ' today-mini';
      } else if (evs.length) {
        cls += ' has-ev';
        const c = evs[0].cor || (evs[0].tipo==='loja' ? 'var(--accent)' : 'var(--yellow)');
        inlineStyle = `background:color-mix(in srgb,${c} 30%,transparent);color:${c};font-weight:700;--dot-cor:${c}`;
      }
      miniHTML += `<div class="${cls}" style="${inlineStyle}" onclick="showMiniDay('${dataStr}')" onmouseenter="showTooltipMini(event,'${dataStr}')" onmouseleave="hideTooltip()">${d}</div>`;
    }
    miniHTML += '</div>';
    box.innerHTML = miniHTML;
    grid.appendChild(box);
  }

  // lista eventos do ano
  document.getElementById('year-events-title').innerHTML = '<i class="ti ti-calendar-event"></i> Todos os eventos do ano';
  renderEventCards('year-events-list', eventos.sort((a,b) => a.data.localeCompare(b.data)));
}

function showMiniDay(dataStr) {
  const [, m, d] = dataStr.split('-');
  const evs = allEventos(viewYear).filter(e => e.data===dataStr);
  if (!evs.length) {
    document.getElementById('ev-data').value = dataStr;
    openModal('modal-add'); return;
  }
  document.getElementById('year-events-title').innerHTML =
    `<i class="ti ti-calendar-event"></i> ${parseInt(d)}/${parseInt(m)} — ${evs.length} evento(s)`;
  renderEventCards('year-events-list', evs);
  document.getElementById('year-events-list').scrollIntoView({behavior:'smooth',block:'start'});
}
