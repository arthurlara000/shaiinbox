<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fundo dourado Shai (acent #c9a96e) — quadrado, com safe zone para corte maskable -->
  <rect width="512" height="512" fill="#c9a96e"/>
  <!-- letra S em Playfair Display, em preto, centralizada e proporcional ao safe area -->
  <text x="50%" y="50%"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Playfair Display', 'Times New Roman', Georgia, serif"
        font-weight="700"
        font-size="340"
        fill="#0f0f0f"
        letter-spacing="-8">S</text>
</svg>
