<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shai Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #222;
  --border: #2e2e2e;
  --text: #f0ede8;
  --text-muted: #888;
  --accent: #c9a96e;
  --green: #52b88a;
  --red: #e05252;
  --loja1: #7b8cde;
  --loja2: #de7bb8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 24px); }

/* AUTH SCREEN */
#auth-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 24px; text-align: center; gap: 8px;
}
.auth-logo { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); margin-bottom: 8px; }
.auth-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
.auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 360px; text-align: left; }
.auth-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
.auth-link { font-size: 0.82rem; color: var(--text-muted); margin-top: 16px; text-align: center; }
.auth-link button { background: none; border: none; color: var(--accent); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; text-decoration: underline; }
.auth-error { font-size: 0.8rem; color: var(--red); margin-top: 10px; text-align: center; min-height: 18px; }

/* MAIN APP */
#app { display: none; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.header-left { display: flex; flex-direction: column; gap: 2px; }
.header-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--accent); }
.header-loja { font-size: 0.75rem; color: var(--text-muted); }
.header-date { font-size: 0.8rem; color: var(--text-muted); text-align: right; }
.change-loja-btn { font-size: 0.7rem; color: var(--text-muted); background: none; border: none; cursor: pointer; text-decoration: underline; }

/* CONTENT */
.content { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

/* SECTION */
.section { margin-bottom: 28px; }
.section-title {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
}

/* CARD */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }

/* FORM */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.form-input, .form-select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--text);
  font-size: 1rem; font-family: 'DM Sans', sans-serif; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.form-select option { background: var(--surface2); }
.form-input.big { font-size: 1.4rem; font-weight: 600; text-align: center; letter-spacing: 0.02em; }

/* VENDEDORA ROW */
.vend-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.vend-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.vend-input {
  width: 120px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; color: var(--accent); font-size: 1rem;
  font-weight: 600; text-align: right; font-family: 'DM Sans', sans-serif;
  outline: none;
}
.vend-input:focus { border-color: var(--accent); }

/* DESPESA ITEM */
.despesa-item {
  background: var(--surface2); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.despesa-info { flex: 1; }
.despesa-desc { font-size: 0.9rem; font-weight: 500; }
.despesa-cat { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
.despesa-valor { font-weight: 700; color: var(--red); white-space: nowrap; }
.despesa-foto { font-size: 1.2rem; cursor: pointer; }
.del-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px; }

/* CATEGORY CHIPS */
.cat-chip {
  padding: 12px 8px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--surface2); color: var(--text-muted); font-size: 0.85rem;
  font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent; text-align: center;
}
.cat-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(201,169,110,0.08); }

/* PHOTO UPLOAD */
.foto-label {
  display: flex; align-items: center; gap: 8px; padding: 12px 14px;
  background: var(--surface2); border: 1.5px dashed var(--border); border-radius: 10px;
  cursor: pointer; color: var(--text-muted); font-size: 0.875rem; transition: all 0.2s;
}
.foto-label:active { border-color: var(--accent); color: var(--accent); }
.foto-preview { width: 100%; border-radius: 10px; max-height: 200px; object-fit: cover; display: none; margin-top: 8px; }
#foto-input { display: none; }

/* BTN */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 16px; border-radius: 12px; font-size: 1rem;
  font-weight: 700; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
  transition: all 0.2s; -webkit-tap-highlight-color: transparent;
}
.btn-primary { background: var(--accent); color: #0f0f0f; }
.btn-primary:active { background: #dbbe85; transform: scale(0.98); }
.btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:active { background: var(--border); }
.btn-sm { padding: 10px 16px; font-size: 0.875rem; width: auto; border-radius: 8px; }
.btn-danger-sm { padding: 8px 14px; font-size: 0.8rem; width: auto; border-radius: 8px; background: rgba(224,82,82,0.12); color: var(--red); border: 1px solid rgba(224,82,82,0.2); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px 20px; width: 100%; max-width: 480px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
.modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 18px; }

/* RESUMO */
.resumo-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.resumo-row:last-child { border-bottom: none; }
.resumo-label { font-size: 0.85rem; color: var(--text-muted); }
.resumo-valor { font-size: 0.95rem; font-weight: 600; }

/* BADGE */
.badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 600; }
.badge-cat { background: rgba(201,169,110,0.12); color: var(--accent); }


/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; padding: 10px 4px;
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-family: 'DM Sans', sans-serif;
  font-size: 0.68rem; font-weight: 500; transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-item .nav-icon { font-size: 1.3rem; line-height: 1; }
.nav-item.active { color: var(--accent); }

/* SAVE BTN flutuante na aba Vendas */
.save-bar {
  padding: 12px 16px; background: var(--bg);
  max-width: 480px; margin: 0 auto;
}

/* HISTORICO */
.hist-row {
  background: var(--surface2); border-radius: 10px; padding: 14px;
  margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
.hist-data { font-size: 0.75rem; color: var(--text-muted); }
.hist-total { font-weight: 700; color: var(--accent); font-size: 1rem; }

/* TOAST */
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 0.875rem; z-index: 9999; opacity: 0; transition: all 0.3s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--green); color: var(--green); }
#toast.error { border-color: var(--red); color: var(--red); }

.dot-ok { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.dot-pend { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }

.empty { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 0.875rem; }
</style>
</head>
<body>

<!-- TELA DE AUTH -->
<div id="auth-screen" style="display:none">
  <div class="auth-logo">Shai Vendas</div>
  <div class="auth-subtitle">Painel da loja</div>

  <!-- LOGIN -->
  <div class="auth-card" id="form-login">
    <div class="auth-title">Entrar</div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-input" id="login-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-input" id="login-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-error" id="login-erro"></div>
    <button class="btn btn-primary" style="margin-top:4px" onclick="fazerLogin()">Entrar</button>
    <div class="auth-link">Não tem conta? <button onclick="mostrarCadastro()">Cadastrar</button></div>
  </div>

  <!-- CADASTRO -->
  <div class="auth-card" id="form-cadastro" style="display:none">
    <div class="auth-title">Criar conta</div>
    <div class="form-group">
      <label class="form-label">Loja</label>
      <select class="form-select" id="cad-loja">
        <option value="Loja Areal">📍 Loja Areal</option>
        <option value="Loja Três Rios">📍 Loja Três Rios</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-input" id="cad-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-input" id="cad-senha" placeholder="mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="auth-error" id="cad-erro"></div>
    <button class="btn btn-primary" style="margin-top:4px" onclick="fazerCadastro()">Criar conta</button>
    <div class="auth-link">Já tem conta? <button onclick="mostrarLogin()">Entrar</button></div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">Shai</div>
      <div class="header-loja" id="h-loja">—</div>
    </div>
    <div style="text-align:right">
      <div class="header-date" id="h-date">—</div>
      <button class="change-loja-btn" onclick="fazerLogout()">sair</button>
    </div>
  </div>

  <!-- ABA: VENDAS -->
  <div id="tab-vendas" class="content" style="padding-bottom:100px">
    <div class="section">
      <div class="section-title">💰 Fechamento do Dia</div>
      <div class="card">
        <div class="form-label" style="margin-bottom:12px">Forma de pagamento</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
          <div>
            <label class="form-label">💵 Dinheiro</label>
            <input type="number" class="form-input" id="total-dinheiro" placeholder="0,00" step="0.01" inputmode="decimal" oninput="calcTotal()">
          </div>
          <div>
            <label class="form-label">💳 Cartão</label>
            <input type="number" class="form-input" id="total-cartao" placeholder="0,00" step="0.01" inputmode="decimal" oninput="calcTotal()">
          </div>
          <div>
            <label class="form-label">📱 Pix</label>
            <input type="number" class="form-input" id="total-pix" placeholder="0,00" step="0.01" inputmode="decimal" oninput="calcTotal()">
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:16px">
          <span style="font-size:0.8rem;color:var(--text-muted)">Total do dia</span>
          <span id="total-loja-display" style="font-size:1.3rem;font-weight:700;color:var(--accent)">R$ 0,00</span>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div class="form-label" style="margin:0">Por vendedora</div>
            <div id="diff-badge" style="font-size:0.75rem;color:var(--text-muted)"></div>
          </div>
          <div id="vendedoras-list"><div class="empty">Carregando...</div></div>
        </div>
      </div>
    </div>
    <div class="save-bar">
      <button class="btn btn-primary" onclick="salvarDia()">✓ Salvar Fechamento</button>
    </div>
  </div>

  <!-- ABA: DESPESAS -->
  <div id="tab-despesas" class="content" style="display:none;padding-bottom:100px">

    <!-- Formulário inline -->
    <div class="card" style="margin-bottom:20px">
      <div class="section-title" style="margin-bottom:14px">🧾 Adicionar Despesa</div>

      <div class="form-label" style="margin-bottom:10px">Categoria</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <button class="cat-chip active" onclick="selectCat('Alimentação',this)">🍽️ Alimentação</button>
        <button class="cat-chip" onclick="selectCat('Limpeza',this)">🧹 Limpeza</button>
        <button class="cat-chip" onclick="selectCat('Manutenção',this)">🔧 Manutenção</button>
        <button class="cat-chip" onclick="selectCat('Outros',this)">📦 Outros</button>
      </div>
      <input type="hidden" id="d-cat" value="Alimentação">

      <div class="form-group" id="d-outros-group" style="display:none">
        <label class="form-label">Descreva o que foi <span style="color:var(--red)">*</span></label>
        <input type="text" class="form-input" id="d-outros-desc" placeholder="Ex: Presente cliente, Taxa bancária...">
      </div>

      <div class="form-group">
        <label class="form-label">Valor (R$)</label>
        <input type="number" class="form-input" id="d-valor" placeholder="0,00" step="0.01" inputmode="decimal">
      </div>

      <div class="form-group">
        <label class="form-label">Foto da nota (opcional)</label>
        <label class="foto-label" for="foto-input">
          📷 <span id="foto-label-text">Tirar foto ou escolher da galeria</span>
        </label>
        <input type="file" id="foto-input" accept="image/*" capture="environment" onchange="previewFoto(this)">
        <img id="foto-preview" class="foto-preview" alt="preview">
      </div>

      <button class="btn btn-primary" onclick="addDespesa()">+ Adicionar Despesa</button>
    </div>

    <!-- Lista de despesas do dia -->
    <div class="section-title" style="margin-bottom:12px">Despesas de hoje</div>
    <div id="despesas-list"><div class="empty">Nenhuma despesa hoje</div></div>
  </div>

  <!-- ABA: HISTÓRICO -->
  <div id="tab-historico" class="content" style="display:none;padding-bottom:100px">
    <div class="section">
      <div class="section-title">📅 Histórico de Vendas</div>
      <div id="historico-list"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-vendas" onclick="showNav('vendas')">
      <span class="nav-icon">💰</span>Vendas
    </button>
    <button class="nav-item" id="nav-despesas" onclick="showNav('despesas')">
      <span class="nav-icon">🧾</span>Despesas
    </button>
    <button class="nav-item" id="nav-historico" onclick="showNav('historico')">
      <span class="nav-icon">📅</span>Histórico
    </button>
  </nav>
</div>


<!-- MODAL RESUMO -->
<div class="modal-overlay" id="modal-resumo">
  <div class="modal" style="max-height:80vh;overflow-y:auto">
    <div class="modal-handle"></div>
    <div class="modal-title">📋 Resumo do Dia</div>
    <div id="resumo-content"></div>
    <div style="margin-top:16px">
      <button class="btn btn-ghost" onclick="closeModal('modal-resumo')">Fechar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ofoljmhfnohxwswskplx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mb2xqbWhmbm9oeHdzd3NrcGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTQzMjIsImV4cCI6MjA5NTM5MDMyMn0.IRfqUSxOLuYBlE79gdCdHaMrtuoYwNrprw6FaXj_7K8';
const sb = supabase.createClient(SB_URL, SB_KEY);

const fmt = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
const today = new Date().toISOString().split('T')[0];
const todayLabel = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });

let lojaAtual = null;
let funcionarias = [];
let despesasTemp = [];
let fotoFile = null;

// ===== AUTH =====
function traduzirErro(msg) {
  if (!msg) return 'Erro desconhecido.';
  const m = msg.toLowerCase();
  if (m.includes('rate limit')) return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';
  if (m.includes('invalid login') || m.includes('invalid credentials')) return 'E-mail ou senha incorretos.';
  if (m.includes('email not confirmed')) return 'E-mail ainda não confirmado.';
  if (m.includes('user already registered') || m.includes('already registered')) return 'Este e-mail já está cadastrado.';
  if (m.includes('password') && m.includes('short')) return 'Senha muito curta. Use no mínimo 6 caracteres.';
  if (m.includes('invalid email')) return 'E-mail inválido.';
  if (m.includes('network') || m.includes('fetch')) return 'Erro de conexão. Verifique sua internet.';
  return msg;
}

function mostrarLogin() {
  document.getElementById('form-login').style.display = '';
  document.getElementById('form-cadastro').style.display = 'none';
  document.getElementById('login-erro').textContent = '';
}
function mostrarCadastro() {
  document.getElementById('form-login').style.display = 'none';
  document.getElementById('form-cadastro').style.display = '';
  document.getElementById('cad-erro').textContent = '';
}

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  document.getElementById('login-erro').textContent = '';
  if (!email || !senha) { document.getElementById('login-erro').textContent = 'Preencha e-mail e senha.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) { document.getElementById('login-erro').textContent = traduzirErro(error.message); return; }
  iniciarApp(data.user.user_metadata?.loja || 'Loja Areal');
}

async function fazerCadastro() {
  const loja  = document.getElementById('cad-loja').value;
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  document.getElementById('cad-erro').textContent = '';
  if (!email || !senha) { document.getElementById('cad-erro').textContent = 'Preencha todos os campos.'; return; }
  if (senha.length < 6) { document.getElementById('cad-erro').textContent = 'Senha mínima de 6 caracteres.'; return; }
  const { data, error } = await sb.auth.signUp({ email, password: senha, options: { data: { loja } } });
  if (error) { document.getElementById('cad-erro').textContent = traduzirErro(error.message); return; }
  showToast('Conta criada! Faça login.', 'success');
  mostrarLogin();
}

async function fazerLogout() {
  if (!confirm('Sair do app?')) return;
  await sb.auth.signOut();
  lojaAtual = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  mostrarLogin();
}

// ===== INIT APP =====
async function iniciarApp(loja) {
  lojaAtual = loja;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('h-loja').textContent = loja;
  document.getElementById('h-date').textContent = todayLabel;
  await loadFuncionarias();
  await loadDespesasHoje();
  await loadVendasHoje();
}

async function loadFuncionarias() {
  const { data } = await sb.from('funcionarias').select('*').eq('loja', lojaAtual).eq('ativa', true).order('nome');
  funcionarias = data || [];
  renderVendedoras();
}

function renderVendedoras() {
  const el = document.getElementById('vendedoras-list');
  if (!funcionarias.length) {
    el.innerHTML = '<div class="empty">Nenhuma vendedora cadastrada nesta loja</div>';
    return;
  }
  el.innerHTML = funcionarias.map(f => `
    <div class="vend-row">
      <div class="vend-name">${f.nome}</div>
      <input class="vend-input" type="number" inputmode="decimal" step="0.01"
        id="vend-${f.id}" placeholder="R$ 0" onchange="calcDiff()">
    </div>`).join('');
}

function calcTotal() {
  const dinheiro = parseFloat(document.getElementById('total-dinheiro').value) || 0;
  const cartao   = parseFloat(document.getElementById('total-cartao').value)   || 0;
  const pix      = parseFloat(document.getElementById('total-pix').value)      || 0;
  const total    = dinheiro + cartao + pix;
  document.getElementById('total-loja-display').textContent = fmt(total);
  calcDiff();
}

function calcDiff() {
  const dinheiro = parseFloat(document.getElementById('total-dinheiro').value) || 0;
  const cartao   = parseFloat(document.getElementById('total-cartao').value)   || 0;
  const pix      = parseFloat(document.getElementById('total-pix').value)      || 0;
  const total    = dinheiro + cartao + pix;
  const somaVend = funcionarias.reduce((s, f) => {
    return s + (parseFloat(document.getElementById(`vend-${f.id}`)?.value) || 0);
  }, 0);
  const diff = total - somaVend;
  const badge = document.getElementById('diff-badge');
  if (total === 0) { badge.textContent = ''; return; }
  if (Math.abs(diff) < 0.01) {
    badge.innerHTML = '<span style="color:var(--green)">✓ Valores conferem</span>';
  } else {
    badge.innerHTML = `<span style="color:var(--accent)">${diff > 0 ? '+' : ''}${fmt(diff)} de diferença</span>`;
  }
}

// ===== DESPESAS =====
async function loadDespesasHoje() {
  const { data } = await sb.from('despesas')
    .select('*').eq('loja', lojaAtual).eq('data_despesa', today).order('criado_em', { ascending: false });
  // Junta com temporárias
  renderDespesas([...(data || []), ...despesasTemp]);
}

function renderDespesas(lista) {
  const el = document.getElementById('despesas-list');
  if (!lista.length) { el.innerHTML = '<div class="empty">Nenhuma despesa hoje</div>'; return; }
  const total = lista.reduce((s, d) => s + d.valor, 0);
  el.innerHTML = lista.map((d, i) => `
    <div class="despesa-item">
      <div class="despesa-info">
        <div class="despesa-desc">${d.descricao}</div>
        <div class="despesa-cat"><span class="badge badge-cat">${d.categoria}</span></div>
      </div>
      ${d.foto_url ? `<span class="despesa-foto" onclick="verFoto('${d.foto_url}')">🖼️</span>` : ''}
      <div class="despesa-valor">${fmt(d.valor)}</div>
      ${!d.id || d._temp ? `<button class="del-btn" onclick="removeDespesaTemp(${i})">✕</button>` : ''}
    </div>`).join('') +
    `<div style="padding:10px 0;text-align:right;font-size:0.85rem;color:var(--text-muted)">
      Total despesas: <strong style="color:var(--red)">${fmt(total)}</strong>
    </div>`;
}

function previewFoto(input) {
  fotoFile = input.files[0];
  if (!fotoFile) return;
  const preview = document.getElementById('foto-preview');
  preview.src = URL.createObjectURL(fotoFile);
  preview.style.display = 'block';
  document.getElementById('foto-label-text').textContent = fotoFile.name;
}

function selectCat(cat, btn) {
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('d-cat').value = cat;
  document.getElementById('d-outros-group').style.display = cat === 'Outros' ? '' : 'none';
  if (cat !== 'Outros') document.getElementById('d-outros-desc').value = '';
}

function addDespesa() {
  const cat   = document.getElementById('d-cat').value;
  const valor = parseFloat(document.getElementById('d-valor').value);
  let desc = cat;
  if (cat === 'Outros') {
    desc = document.getElementById('d-outros-desc').value.trim();
    if (!desc) { showToast('Descreva o que foi comprado', 'error'); return; }
  }
  if (!valor) { showToast('Informe o valor', 'error'); return; }

  despesasTemp.push({ descricao: desc, categoria: cat, valor, _foto: fotoFile, _temp: true });

  // reset form
  document.querySelectorAll('.cat-chip').forEach((b,i) => b.classList.toggle('active', i===0));
  document.getElementById('d-cat').value = 'Alimentação';
  document.getElementById('d-outros-group').style.display = 'none';
  document.getElementById('d-outros-desc').value = '';
  document.getElementById('d-valor').value = '';
  document.getElementById('foto-preview').style.display = 'none';
  document.getElementById('foto-label-text').textContent = 'Tirar foto ou escolher da galeria';
  fotoFile = null;
  document.getElementById('foto-input').value = '';

  loadDespesasHoje();
  showToast('Despesa adicionada!');
}

function removeDespesaTemp(idx) {
  // idx é relativo à lista combinada (salvas + temp)
  // mas só removemos as temp, então precisamos ajustar
  despesasTemp = [];
  loadDespesasHoje();
}

function verFoto(url) {
  window.open(url, '_blank');
}

// ===== CARREGAR DADOS JÁ SALVOS HOJE =====
async function loadVendasHoje() {
  // Carrega fechamento do dia se já existir
  const { data: fech } = await sb.from('fechamento_dia')
    .select('*, fechamento_vendedoras(*, funcionarias(nome))')
    .eq('loja', lojaAtual).eq('data_fechamento', today).single();

  if (fech) {
    document.getElementById('total-dinheiro').value = fech.total_dinheiro || '';
    document.getElementById('total-cartao').value   = fech.total_cartao   || '';
    document.getElementById('total-pix').value      = fech.total_pix      || '';
    calcTotal();
    (fech.fechamento_vendedoras || []).forEach(fv => {
      const el = document.getElementById(`vend-${fv.funcionaria_id}`);
      if (el) el.value = fv.valor;
    });
    calcDiff();
  }
}

// ===== SALVAR DIA =====
async function salvarDia() {
  const total_dinheiro = parseFloat(document.getElementById('total-dinheiro').value) || 0;
  const total_cartao   = parseFloat(document.getElementById('total-cartao').value)   || 0;
  const total_pix      = parseFloat(document.getElementById('total-pix').value)      || 0;
  const total          = total_dinheiro + total_cartao + total_pix;
  if (!total) { showToast('Informe pelo menos uma forma de pagamento', 'error'); return; }

  const btn = document.querySelector('.save-bar .btn-primary');
  btn.textContent = 'Salvando...';
  btn.disabled = true;

  try {
    // 1. Salva fechamento do dia
    const { data: fech, error: fechErr } = await sb.from('fechamento_dia').upsert(
      { loja: lojaAtual, data_fechamento: today, total_loja: total, total_dinheiro, total_cartao, total_pix },
      { onConflict: 'loja,data_fechamento' }
    ).select().single();
    if (fechErr) throw fechErr;

    // 2. Salva por vendedora (apaga antigas e reinsere)
    await sb.from('fechamento_vendedoras').delete().eq('fechamento_id', fech.id);
    const vendRows = funcionarias
      .map(f => ({ fechamento_id: fech.id, funcionaria_id: f.id, valor: parseFloat(document.getElementById(`vend-${f.id}`)?.value) || 0 }))
      .filter(r => r.valor > 0);
    if (vendRows.length) await sb.from('fechamento_vendedoras').insert(vendRows);

    // 3. Também insere em vendas (tabela principal) para o dashboard funcionar
    await sb.from('vendas').delete().eq('loja', lojaAtual).eq('data_venda', today);
    const vendasRows = vendRows.map(r => ({ funcionaria_id: r.funcionaria_id, loja: lojaAtual, data_venda: today, valor: r.valor }));
    if (vendasRows.length) await sb.from('vendas').insert(vendasRows);
    // Venda sem funcionária = diferença
    const somaVend = vendRows.reduce((s, r) => s + r.valor, 0);
    const restante = total - somaVend;
    if (restante > 0.01) {
      await sb.from('vendas').insert({ funcionaria_id: null, loja: lojaAtual, data_venda: today, valor: restante, descricao: 'Sem atribuição' });
    }

    // 4. Salva despesas temporárias com upload de foto
    for (const d of despesasTemp) {
      let foto_url = null;
      if (d._foto) {
        const ext = d._foto.name.split('.').pop();
        const path = `${lojaAtual}/${today}/${Date.now()}.${ext}`;
        const { data: up } = await sb.storage.from('notas-despesas').upload(path, d._foto, { upsert: true });
        if (up) {
          const { data: pub } = sb.storage.from('notas-despesas').getPublicUrl(path);
          foto_url = pub?.publicUrl || null;
        }
      }
      await sb.from('despesas').insert({ loja: lojaAtual, data_despesa: today, descricao: d.descricao, categoria: d.categoria, valor: d.valor, foto_url });
    }
    despesasTemp = [];

    showToast('Dia salvo com sucesso! ✓', 'success');
    loadDespesasHoje();
  } catch (e) {
    console.error(e);
    showToast('Erro ao salvar. Tente novamente.', 'error');
  } finally {
    btn.textContent = '✓ Salvar Fechamento';
    btn.disabled = false;
  }
}

// ===== RESUMO =====
async function verResumo() {
  const total = parseFloat(document.getElementById('total-loja').value) || 0;
  const { data: desp } = await sb.from('despesas').select('*').eq('loja', lojaAtual).eq('data_despesa', today);
  const totalDesp = [...(desp || []), ...despesasTemp].reduce((s, d) => s + d.valor, 0);
  const liquido = total - totalDesp;

  const vendRows = funcionarias.map(f => {
    const val = parseFloat(document.getElementById(`vend-${f.id}`)?.value) || 0;
    return { nome: f.nome, val };
  }).filter(r => r.val > 0);

  document.getElementById('resumo-content').innerHTML = `
    <div class="resumo-row"><span class="resumo-label">📅 Data</span><span class="resumo-valor">${todayLabel}</span></div>
    <div class="resumo-row"><span class="resumo-label">📍 Loja</span><span class="resumo-valor">${lojaAtual}</span></div>
    <div style="height:8px"></div>
    <div class="resumo-row"><span class="resumo-label" style="font-weight:600">💰 Total Bruto</span><span class="resumo-valor" style="color:var(--accent);font-size:1.1rem">${fmt(total)}</span></div>
    ${vendRows.map(r => `<div class="resumo-row" style="padding-left:12px"><span class="resumo-label">↳ ${r.nome}</span><span class="resumo-valor">${fmt(r.val)}</span></div>`).join('')}
    <div style="height:8px"></div>
    <div class="resumo-row"><span class="resumo-label">🧾 Total Despesas</span><span class="resumo-valor" style="color:var(--red)">${fmt(totalDesp)}</span></div>
    <div class="resumo-row" style="padding-top:12px"><span class="resumo-label" style="font-weight:700">✨ Líquido do Dia</span><span class="resumo-valor" style="color:var(--green);font-size:1.1rem">${fmt(liquido)}</span></div>
  `;
  openModal('modal-resumo');
}

// ===== NAV =====
function showNav(tab) {
  ['vendas','despesas','historico'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
    document.getElementById('nav-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'historico') loadHistorico();
}

// ===== HISTÓRICO =====
async function loadHistorico() {
  const el = document.getElementById('historico-list');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const { data } = await sb.from('fechamento_dia')
    .select('*, fechamento_vendedoras(valor, funcionarias(nome))')
    .eq('loja', lojaAtual)
    .order('data_fechamento', { ascending: false })
    .limit(30);
  if (!data?.length) { el.innerHTML = '<div class="empty">Nenhum fechamento registrado</div>'; return; }
  el.innerHTML = data.map(d => {
    const vends = (d.fechamento_vendedoras || [])
      .map(v => `<div style="font-size:0.78rem;color:var(--text-muted);padding-left:8px">↳ ${v.funcionarias?.nome || '—'}: ${fmt(v.valor)}</div>`)
      .join('');
    return `
      <div class="hist-row" style="flex-direction:column;align-items:flex-start;gap:6px">
        <div style="display:flex;justify-content:space-between;width:100%">
          <span class="hist-data">${new Date(d.data_fechamento + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' })}</span>
          <span class="hist-total">${fmt(d.total_loja)}</span>
        </div>
        ${vends}
      </div>`;
  }).join('');
}

// ===== UTILS =====
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});
